<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integra — Modelagem e Análise Financeira</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f9;--panel:#fff;--ink:#121826;--ink2:#475166;--ink3:#8791a5;--line:#e3e7ee;--line2:#eef1f5;
--brand:#1d3557;--brand2:#28507f;--brandSoft:#e8eef6;--acc:#d9772b;--accSoft:#fcefe3;
--green:#23845a;--greenSoft:#e4f3ec;--red:#c0392b;--redSoft:#fbe8e6;--amber:#b7791f;--amberSoft:#fdf3df;--blue:#2f5fb3;--blueSoft:#e8eefa;
--s1:#1d4e89;--s2:#2a9d8f;--s3:#e9a23b;--s4:#c44536;--s5:#7b8794}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:#0f1c2e;color:#c9d4e3;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.logo{display:flex;gap:10px;align-items:center;padding:18px}
.logo .mk{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#3d7cc9,#1d3557);display:grid;place-items:center;color:#fff;font-weight:700}
.logo b{color:#fff;font-size:15.5px;display:block}.logo small{color:#7f93ad;font-size:11px}
.crumb{margin:0 12px 8px;padding:9px 12px;background:#162a44;border-radius:9px;font-size:11.5px;color:#8fa3bd}
.crumb b{color:#fff;font-size:12.5px;display:block}
.nav{padding:4px 8px;flex:1}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#5f7593;padding:14px 10px 6px}
.nav a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:#c9d4e3;cursor:pointer;font-weight:500;font-size:13.5px}
.nav a:hover{background:#162a44;color:#fff}.nav a.on{background:#24416a;color:#fff}
.nav a svg{width:17px;height:17px;flex:none}
.sidefoot{padding:12px 16px;font-size:11px;color:#5f7593;border-top:1px solid #1a2f4b}
.main{min-width:0}
.top{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 22px;position:sticky;top:0;z-index:20}
.top .mdl{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.top .mdl select{max-width:360px}
.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.n{background:var(--line2);color:var(--ink2)}.tag.b{background:var(--brandSoft);color:var(--brand)}.tag.g{background:var(--greenSoft);color:var(--green)}.tag.r{background:var(--redSoft);color:var(--red)}.tag.a{background:var(--amberSoft);color:var(--amber)}.tag.o{background:var(--accSoft);color:var(--acc)}
.content{padding:22px 26px 70px;max-width:1400px}
h1{font-size:21px;letter-spacing:-.3px}
.sub{color:var(--ink2);margin-top:2px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.btn{height:35px;padding:0 13px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--bg)}.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand2)}
.btn.sm{height:29px;padding:0 10px;font-size:12.5px;border-radius:8px}.btn.red{color:var(--red)}.btn.ghost{border-color:transparent;background:transparent}
.btn svg{width:15px;height:15px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.card .hd h3{font-size:14.5px}
.card .bd{padding:16px}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}.g21{grid-template-columns:2fr 1fr}.g5{grid-template-columns:repeat(5,1fr)}
.kpi{padding:14px 16px}.kpi .l{font-size:12.5px;color:var(--ink2);font-weight:500}.kpi .v{font-size:22px;font-weight:700;margin-top:5px;letter-spacing:-.3px;font-variant-numeric:tabular-nums}.kpi .d{font-size:12px;color:var(--ink3);margin-top:2px}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink3);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:#fafbfc;white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums}
.ft td{font-size:13px}
.ft td:first-child{white-space:nowrap;position:sticky;left:0;background:#fff;z-index:1;min-width:260px}
.ft th:first-child{position:sticky;left:0;z-index:2}
.ft tr.tot td{font-weight:700;background:#f7f9fc}.ft tr.tot td:first-child{background:#f7f9fc}
.ft tr.sec td{font-weight:700;color:var(--brand);background:#fff;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;padding-top:14px}
.ft tr.sub td:first-child{padding-left:26px;color:var(--ink2)}
.ft tr.kp td{color:var(--ink2);font-style:italic}
.num{text-align:right;white-space:nowrap}
.neg{color:var(--red)}
.tblwrap{overflow:auto}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}
.tabs a{padding:9px 14px;cursor:pointer;color:var(--ink2);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--brand);border-color:var(--brand)}
.inp,.sel{height:34px;border:1px solid var(--line);border-radius:8px;padding:0 9px;background:#fff;outline:none;min-width:0}
.inp:focus,.sel:focus{border-color:var(--brand2)}
.inp.n{text-align:right}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 14px}
.form .f{display:flex;flex-direction:column;gap:4px}
.form .f.w2{grid-column:span 2}.form .f.full{grid-column:1/-1}
.form label{font-size:12px;font-weight:600;color:var(--ink2)}
.form .hint{font-size:11.5px;color:var(--ink3)}
.alert{display:flex;gap:10px;padding:10px 12px;border-radius:9px;font-size:13px;margin-bottom:8px;align-items:flex-start}
.alert svg{width:17px;height:17px;flex:none;margin-top:1px}
.alert.r{background:var(--redSoft);color:#86281d}.alert.a{background:var(--amberSoft);color:#73500f}.alert.b{background:var(--blueSoft);color:#1f3f7a}.alert.g{background:var(--greenSoft);color:#1b5e3f}
.verdict{padding:16px;border-radius:12px;display:flex;gap:14px;align-items:flex-start}
.verdict .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:20px;font-weight:700;color:#fff}
.muted{color:var(--ink3)}
.strip{display:flex;gap:18px;flex-wrap:wrap;padding:10px 16px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:16px;align-items:center}
.strip div{font-size:12px;color:var(--ink2)}.strip b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.ov{position:fixed;inset:0;background:rgba(10,18,30,.45);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.ov.on{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:820px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .mh{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal .mb{padding:18px 20px;overflow:auto}.modal .mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.x{width:32px;height:32px;border:0;background:transparent;border-radius:8px;cursor:pointer;font-size:20px;color:var(--ink3)}
.sect{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sect label{border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;display:block}
.sect label:has(input:checked){border-color:var(--brand2);background:var(--brandSoft)}
.sect input{display:none}.sect b{display:block;font-size:13.5px}.sect small{color:var(--ink3);font-size:12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#121826;color:#fff;padding:11px 18px;border-radius:10px;opacity:0;transition:.2s;z-index:99;pointer-events:none;font-weight:500}
.toast.on{opacity:1;transform:translateX(-50%)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg text{font-family:Inter,system-ui,sans-serif}
.hm td{text-align:center;font-size:12.5px;padding:7px 6px}
.rowact{display:flex;gap:6px;align-items:center}
.sm-in{height:30px;width:100%}
.ratio{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2);gap:10px}
.ratio:last-child{border-bottom:0}
.ratio>span:first-child{flex:1}
textarea.inp{height:auto;padding:8px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:12px}

.docv{display:flex;flex-direction:column;align-items:center;gap:16px;min-width:0}
.docv .dnote{background:#fff8ea;border:1px solid #f1dfb8;color:#6b4e12;border-radius:8px;padding:8px 12px;font-size:12.5px;width:100%;max-width:794px}
.docv .page{width:794px;max-width:100%;min-height:1080px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:50px 58px 24px;display:flex;flex-direction:column;font-family:'Source Serif 4',Georgia,serif;font-size:13px;line-height:1.6;color:#1b1f27}
.docv .page.land{width:100%;max-width:1120px;min-height:700px;padding:36px 40px 20px}
.docv h1{font-family:Inter,sans-serif;font-size:16.5px;letter-spacing:.4px;text-align:center;margin:20px 0 4px;text-transform:uppercase}
.docv .subt{text-align:center;color:#5b6270;font-size:12.5px;margin-bottom:14px;font-family:Inter,sans-serif}
.docv h3{font-family:Inter,sans-serif;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--brand);margin:14px 0 6px}
.docv p{margin:0 0 8px;text-align:justify}
.docv .lh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--brand);padding-bottom:12px;font-family:Inter,sans-serif}
.docv .lh .lhco{display:flex;gap:10px;align-items:center}.docv .lh .mk{width:38px;height:38px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700}
.docv .lh b{font-size:14px;display:block}.docv .lh small{color:#6a7180;font-size:11px;display:block;line-height:1.45}.docv .lh .rt{text-align:right;font-size:11px;color:#6a7180;line-height:1.5}
.docv .foot{margin-top:auto;border-top:1px solid #e3e6ea;padding-top:6px;font-family:Inter,sans-serif;font-size:9.5px;color:#8a92a1;display:flex;justify-content:space-between}
.docv .page>*:nth-last-child(2){margin-bottom:26px}
.docv table.t{width:100%;border-collapse:collapse;font-family:Inter,sans-serif;font-size:11.2px;margin:6px 0 10px}
.docv table.t th{background:#f1f4f8;color:#475166;text-transform:uppercase;font-size:9.6px;letter-spacing:.3px;text-align:left;padding:6px 7px;border-bottom:1px solid #d9dee6}
.docv table.t td{padding:5px 7px;border-bottom:1px solid #edf0f4;vertical-align:top}
.docv table.t .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.docv table.t tr.tot td{font-weight:700;border-top:1.5px solid #1b1f27;background:#f9fafc}
.docv .box{border:1px solid #d9dee6;border-radius:6px;padding:9px 12px;font-family:Inter,sans-serif;font-size:11.3px;margin:6px 0}
.docv .sig{display:grid;grid-template-columns:1fr 1fr;gap:46px;margin-top:36px;font-family:Inter,sans-serif;font-size:11.3px;text-align:center}
.docv .sig div{border-top:1px solid #1b1f27;padding-top:6px}.docv .sig small{display:block;color:#7a8190}
.docv .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.docv .legend{font-family:Inter,sans-serif}
.docv .tg{display:inline-block;padding:1px 7px;border-radius:10px;font-family:Inter,sans-serif;font-size:10px;font-weight:600;background:#e4f3ec;color:#23845a}.docv .tg.a{background:#fdf3df;color:#b7791f}.docv .tg.r{background:#fbe8e6;color:#c0392b}.docv .tg.n{background:#eef1f5;color:#475166}
@media(max-width:1150px){.g4,.g5{grid-template-columns:repeat(2,1fr)}.g21,.g3{grid-template-columns:1fr}.form{grid-template-columns:repeat(2,1fr)}.sect{grid-template-columns:1fr 1fr}}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{display:none}.g2{grid-template-columns:1fr}.content{padding:14px}}
</style>
</head>

  labels.forEach((l,i)=>{const cx=P.l+gw*i+gw/2;series.forEach((se,j)=>{const v=se.data[i];if(v==null)return;const x=cx-bw*series.length/2+bw*j;const y0=y(0),y1=y(v);s+=`<rect x="${x+1}" y="${Math.min(y0,y1)}" width="${bw-2}" height="${Math.max(1,Math.abs(y1-y0))}" rx="2" fill="${(se.colorFn?se.colorFn(v,i):se.color)}"><title>${esc(se.name)} ${l}: ${fmt(v)}</title></rect>`;});
    if(n<=12||i%2===0)s+=`<text x="${cx}" y="${h-8}" font-size="11.5" text-anchor="middle" fill="#8791a5">${l}</text>`;});
  if(line){const pts=line.data.map((v,i)=>v==null?null:`${P.l+gw*i+gw/2},${y(v)}`).filter(Boolean);s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${line.color}" stroke-width="2.2"/>`;line.data.forEach((v,i)=>{if(v!=null)s+=`<circle cx="${P.l+gw*i+gw/2}" cy="${y(v)}" r="3" fill="#fff" stroke="${line.color}" stroke-width="2"><title>${esc(line.name)} ${labels[i]}: ${fmt(v)}</title></circle>`});}
  if(ref!=null)s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(ref)}" y2="${y(ref)}" stroke="#c0392b" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-P.r-4}" y="${y(ref)-5}" font-size="10.5" text-anchor="end" fill="#c0392b">mínimo ${fmt(ref)}</text>`;
  return s+'</svg>';}

function hBars(rows,{center=0,fmt=v=>mv(v),h0=30}){const W=640,L=200,R=14;const all=rows.flatMap(r=>[r.lo,r.hi,center]);const mn=Math.min(...all),mx=Math.max(...all);const x=v=>L+(v-mn)/((mx-mn)||1)*(W-L-R-130);const H=rows.length*h0+30;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:880px;display:block">`;s+=`<line x1="${x(center)}" x2="${x(center)}" y1="4" y2="${H-20}" stroke="#121826" stroke-width="1.2"/><text x="${x(center)}" y="${H-6}" font-size="10.5" text-anchor="middle" fill="#475166">${fmt(center)}</text>`;
  rows.forEach((r,i)=>{const yy=8+i*h0;s+=`<text x="${L-10}" y="${yy+15}" font-size="12.5" text-anchor="end" fill="#121826">${esc(r.name)}</text>`;
    const a=Math.min(r.lo,r.hi),b=Math.max(r.lo,r.hi);
    if(r.range){s+=`<rect x="${x(a)}" y="${yy+3}" width="${Math.max(2,x(b)-x(a))}" height="18" rx="3" fill="${r.color||'#28507f'}"/>`;}
    else{s+=`<rect x="${Math.min(x(r.lo),x(center))}" y="${yy+3}" width="${Math.abs(x(r.lo)-x(center))}" height="18" fill="#c44536" opacity=".85"/><rect x="${Math.min(x(r.hi),x(center))}" y="${yy+3}" width="${Math.abs(x(r.hi)-x(center))}" height="18" fill="#2a9d8f" opacity=".9"/>`;}
    s+=`<text x="${x(b)+6}" y="${yy+16}" font-size="11.5" fill="#475166">${r.range?fmt(a)+' – '+fmt(b):fmt(r.lo)+' | '+fmt(r.hi)}</text>`;});return s+'</svg>';}

function verdict(m,R){if(m.inicio==='existente'){const pb=R.bookEq>0?R.eqVal/R.bookEq:null;const c=R.eqVal>R.bookEq?'g':R.eqVal>0?'a':'r';
  return {inv:{c,t:c==='g'?'O valor económico supera o valor contabilístico':c==='a'?'Valor económico abaixo dos capitais próprios contabilísticos':'Capital próprio sem valor económico positivo',d:`Enterprise value de ${money(R.ev)} (WACC ${pct(R.wacc)}); dívida líquida ${money(R.netDebt0)}; valor do capital próprio ${money(R.eqVal)} vs. ${money(R.bookEq)} contabilísticos (P/VC ${xf(pb)}). EV/EBITDA implícito ${xf(R.k.ebitda[1]?R.ev/R.k.ebitda[1]:null)}.`},bank:R.hasDebt?bankV(m,R):null,be:null};}
  const ok=R.npv>0&&R.irr!=null&&R.irr>R.wacc;const be=breakEvenPrice(m);const marg=be!=null?1-be:null;
  const inv={c:ok?(marg>0.15?'g':'a'):'r',t:ok?(marg>0.15?'Cria valor para o accionista':'Cria valor, mas com margem de segurança curta'):'Destrói valor nas condições actuais',
    d:`VAL de ${money(R.npv)} a um WACC de ${pct(R.wacc)}; TIR do projecto ${pct(R.irr)}${R.irrEq!=null?`, TIR do accionista ${pct(R.irrEq)} (Ke ${pct(R.ke)})`:''}. ${be!=null?`O VAL anula-se se o preço cair ${pct(1-be,0)} face ao cenário base.`:''}${R.fundingGap>0?` Necessidade adicional de capital/suprimentos: ${money(R.fundingGap)}.`:''}`};
  return {inv,bank:R.hasDebt?bankV(m,R):null,be};}
function bankV(m,R){const okB=R.minDscr!=null&&R.minDscr>=m.cov.dscr;const near=R.minDscr!=null&&R.minDscr>=1.1;
    return {c:okB?'g':near?'a':'r',t:okB?'Bancável — cumpre o DSCR mínimo':near?'Bancável com reforço (garantias, prazo ou carência)':'Não bancável na estrutura proposta',
      d:`DSCR mínimo ${xf(R.minDscr)} (covenant ${xf(m.cov.dscr)}), médio ${xf(R.avgDscr)}; LLCR ${xf(R.llcr)}.${m.divida.montante>0?` Capacidade de endividamento ao DSCR alvo: ${money(R.debtCap)} vs. ${money(m.divida.montante)} pedidos.`:' Dívida existente no balanço de abertura.'}`};}

   </div></div></div>`,
   capex:`<div class="card"><div class="hd"><h3>Plano de investimento (classe 1 — Meios fixos)</h3><button class="btn sm" data-act="addCap">+ Investimento</button></div><div class="tblwrap"><table><thead><tr><th>Investimento</th><th class="num">Ano</th><th class="num">Valor (${cur})</th><th class="num">Vida útil (anos)</th><th class="num">Amortização anual</th><th></th></tr></thead><tbody>
     ${m.capex.map((c,i)=>`<tr><td><input class="inp sm-in" data-p="capex.${i}.nome" data-t="t" value="${esc(c.nome)}" style="min-width:240px"></td><td><input class="inp n sm-in" type="number" data-p="capex.${i}.ano" value="${c.ano}" style="width:70px"></td><td><input class="inp n sm-in" type="number" step="any" data-p="capex.${i}.valor" value="${c.valor}" style="width:150px"></td><td><input class="inp n sm-in" type="number" data-p="capex.${i}.vida" value="${c.vida}" style="width:80px"></td><td class="num">${money(c.valor/c.vida)}</td><td><button class="btn sm ghost red" data-act="delCap" data-i="${i}">×</button></td></tr>`).join('')}
     <tr class="tot"><td><b>Total</b></td><td></td><td class="num"><b>${money(m.capex.reduce((s,c)=>s+ +c.valor,0))}</b></td><td></td><td></td><td></td></tr></tbody></table></div>
     <div class="bd"><div class="form">${F('manut','CAPEX de manutenção (% receitas)','Reinvestimento para manter capacidade')}${F('vidaManut','Vida útil da manutenção (anos)')}<div class="f w2"><span class="hint" style="margin-top:20px">Amortização linear (quotas constantes), a partir do ano seguinte ao investimento ou do início da operação.</span></div></div></div></div>`,
   fm:`<div class="card"><div class="hd"><h3>Fundo de maneio</h3></div><div class="bd"><div class="form">${F('dso','Prazo médio de recebimento (dias)','Clientes — 31')}${F('dio','Prazo médio de existências (dias)','Sobre custos variáveis — classe 2')}${F('dpo','Prazo médio de pagamento (dias)','Fornecedores — 32')}${F('caixaMin',`Caixa mínima (${cur})`,'Abaixo disto o modelo exige suprimentos')}</div></div></div>`,
   fin:`<div class="card"><div class="hd"><h3>Estrutura de financiamento</h3></div><div class="bd"><div class="form">
     ${m.inicio==='existente'?'':F('capitalInicial',`Capital social inicial (${cur})`,'Realizado no ano 0')}${F('payout','Distribuição de dividendos (% RL)','Só com resultados acumulados positivos')}
     <div class="f full sec" style="font-size:11.5px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.5px;margin-top:6px">Empréstimo ${m.inicio==='existente'?'novo':'bancário'}</div>
     ${F('divida.montante',`Montante (${cur})`)}${F('divida.taxa','Taxa de juro (% a.a.)',cur==='Kz'?'Aviso 10/BDA/PRODESI vs. crédito comercial':'Financiamento em USD')}${F('divida.prazo','Prazo total (anos)')}${F('divida.carencia','Carência de capital (anos)')}
     ${F('divida.ano','Ano de desembolso')}
     <div class="f full sec" style="font-size:11.5px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.5px;margin-top:6px">Covenants do financiador</div>
     ${F('cov.dscr','DSCR mínimo (×)')}${F('cov.ndEbitda','Dívida líquida / EBITDA máx. (×)')}${F('cov.icr','Cobertura de juros mín. (×)')}
   </div></div></div>`,
   taxa:`<div class="card"><div class="hd"><h3>Taxa de desconto (WACC)</h3></div><div class="bd"><div class="form">
     ${SelF('wacc.modo','Método',[['capm','CAPM + prémio de risco país'],['manual','Taxa definida manualmente']])}
     ${m.wacc.modo==='manual'?F('wacc.manual','Taxa de desconto (%)'):`${F('wacc.rf','Taxa sem risco (%)',cur==='USD'?'US Treasury 10 anos':'Obrigações do Tesouro em Kz')}${F('wacc.beta','Beta (alavancado)','Referência sectorial')}${F('wacc.erp','Prémio de risco de mercado (%)')}${F('wacc.crp','Prémio de risco país (%)',cur==='USD'?'Risco Angola sobre activos em USD':'0 se a taxa sem risco já é em Kz')}${F('wacc.kd','Custo da dívida (% antes de imposto)')}${F('wacc.wd','Peso da dívida D/(D+E) (%)')}
     <div class="f w2"><label>Resultado</label><div class="inp" style="display:flex;align-items:center;gap:14px;background:#fafbfc">Ke ${pct(keOf(m))} · Kd líquido ${pct(m.wacc.kd/100*(1-m.ii/100))} · <b>WACC ${pct(waccOf(m))}</b></div></div>`}
   </div></div></div>
   <div class="card" style="margin-top:16px"><div class="hd"><h3>Valor terminal e múltiplos</h3></div><div class="bd"><div class="form">
     ${SelF('tv.metodo','Método do valor terminal',[['nenhum','Sem valor terminal (vida finita)'],['gordon','Crescimento perpétuo (Gordon)'],['multiplo','Múltiplo de saída (EV/EBITDA)']],'Recursos esgotáveis (minas, campos) → sem valor terminal')}
     ${F('tv.g','Crescimento perpétuo g (%)','Nominal, na moeda do modelo')}${F('tv.mult','Múltiplo de saída EV/EBITDA (×)')}<div></div>
     ${F('mult.lo','Múltiplo EV/EBITDA comparáveis — mínimo')}${F('mult.hi','Múltiplo EV/EBITDA comparáveis — máximo')}${F('sens','Amplitude da sensibilidade (± %)')}
   </div></div></div>`
  };
  return ph('Pressupostos',`Todas as demonstrações, a avaliação e as métricas de crédito recalculam ao alterar qualquer valor · ${SECT[m.sector]?.d||''}`)+liveStrip()+
  `<div class="tabs">${[['geral','Geral'],['receitas','Receitas'],['custos','Custos & impostos'],['capex','Investimento'],['fm','Fundo de maneio'],['fin','Financiamento'],['taxa','Taxa de desconto']].map(([k,n])=>`<a class="${tab===k?'on':''}" data-act="sub" data-k="pt" data-v="${k}">${n}</a>`).join('')}</div>${T[tab]}`;};
VIEWS.pressupostos.after=()=>{bindCommon();document.querySelectorAll('[data-p]').forEach(i=>i.onchange=()=>{const m=M();const v=i.dataset.t==='t'?i.value:(i.value===''?0:Number(i.value));setP(m,i.dataset.p,v);save();
  if(['inicio','wacc.modo','moeda','nome'].includes(i.dataset.p)||i.closest('table'))render();else{$('#live').outerHTML=liveStrip();bindCommon();}toast('Modelo recalculado');});};

/* ---------------- Demonstrações projectadas ---------------- */
function finRow(n,arr,cls='',fmt=v=>mv(v)){return `<tr class="${cls}"><td>${n}</td>${arr.map(v=>`<td class="num ${v<-1e-6&&!cls.includes('kp')?'neg':''}">${fmt(v)}</td>`).join('')}</tr>`;}
VIEWS.demonstracoes=()=>{const m=M(),R=run(m),k=R.k;const tab=SUB.dt||'dr';const neg=a=>a.map(v=>-v);
  const head=`<thead><tr><th>${unitLbl()}</th>${R.years.map((y,t)=>`<th class="num">${y}<div style="font-weight:400;text-transform:none;letter-spacing:0">Ano ${t}</div></th>`).join('')}</tr></thead>`;
  let body='';
  if(tab==='dr'){body=`<tr class="sec"><td colspan="${R.H+2}">Classe 6 — Proveitos e ganhos</td></tr>`+
    m.receitas.map((r,i)=>finRow(`Vendas / prestações — ${esc(r.nome)}`,R.lines[i],'sub')).join('')+finRow('Volume de negócios',k.rev,'tot')+
    `<tr class="sec"><td colspan="${R.H+2}">Classe 7 — Custos e perdas</td></tr>`+finRow('71 · Custo das existências vendidas e consumidas',neg(k.cv),'sub')+(m.royalty?finRow('75 · Royalties / imposto sobre a produção',neg(k.roy),'sub'):'')+finRow('72 · Custos com o pessoal',neg(k.pes),'sub')+finRow('75.2 · Fornecimentos e serviços de terceiros',neg(k.fst),'sub')+finRow('75 · Outros custos operacionais',neg(k.out),'sub')+
    finRow('EBITDA',k.ebitda,'tot')+finRow('Margem EBITDA',k.ebitda.map((v,t)=>k.rev[t]?v/k.rev[t]:null),'kp',v=>pct(v))+finRow('73 · Amortizações do exercício',neg(k.da),'sub')+finRow('Resultado operacional (82)',k.ebit,'tot')+
    finRow('76 · Custos e perdas financeiros (juros)',neg(k.jur),'sub')+finRow('Resultado antes de impostos',k.ebt,'tot')+finRow(`87 · Imposto sobre os lucros (${m.ii}%)`,neg(k.imp),'sub')+finRow('Resultado líquido do exercício (88)',k.rl,'tot')+finRow('Margem líquida',k.rl.map((v,t)=>k.rev[t]?v/k.rev[t]:null),'kp',v=>pct(v));}
  if(tab==='bal'){body=`<tr class="sec"><td colspan="${R.H+2}">Activo</td></tr>`+finRow('Classe 1 · Imobilizado líquido',k.imob,'sub')+finRow('Classe 2 · Existências',k.inv,'sub')+finRow('31 · Clientes',k.ar,'sub')+finRow('Classe 4 · Meios monetários',k.cash,'sub')+finRow('Total do activo',k.assets,'tot')+
    `<tr class="sec"><td colspan="${R.H+2}">Capital próprio e passivo</td></tr>`+finRow('51 · Capital (incl. suprimentos/aumentos)',k.cap,'sub')+finRow('81/88 · Resultados acumulados',k.res,'sub')+finRow('Total do capital próprio',k.cap.map((c,i)=>c+k.res[i]),'tot')+finRow('33 · Empréstimos obtidos',k.debt,'sub')+finRow('32 · Fornecedores',k.ap,'sub')+finRow('Total do passivo',k.debt.map((d,i)=>d+k.ap[i]),'tot')+finRow('Total do capital próprio e passivo',k.le,'tot')+
    finRow('Verificação (Activo − CP − Passivo)',k.check,'kp',v=>Math.abs(v)<1?'✓ 0':mv(v));}
  if(tab==='fc'){body=`<tr class="sec"><td colspan="${R.H+2}">Actividades operacionais</td></tr>`+finRow('Resultado líquido',k.rl,'sub')+finRow('+ Amortizações',k.da,'sub')+finRow('− Variação do fundo de maneio',neg(k.dnwc),'sub')+finRow('Fluxo de caixa operacional',k.cfo,'tot')+
    `<tr class="sec"><td colspan="${R.H+2}">Actividades de investimento</td></tr>`+finRow('CAPEX de expansão',neg(k.capexExp),'sub')+finRow('CAPEX de manutenção',neg(k.capexMan),'sub')+finRow('Fluxo de caixa de investimento',k.cfi,'tot')+
    `<tr class="sec"><td colspan="${R.H+2}">Actividades de financiamento</td></tr>`+finRow('Realização de capital',k.eqInj,'sub')+finRow('Suprimentos / aumento de capital necessários',k.eqAuto,'sub')+finRow('Desembolso de empréstimos',k.draw,'sub')+finRow('Reembolso de empréstimos',neg(k.princ),'sub')+finRow('Dividendos pagos',neg(k.div),'sub')+finRow('Fluxo de caixa de financiamento',k.cff,'tot')+
    finRow('Variação de caixa',k.cash.map((c,i)=>c-(i?k.cash[i-1]:(m.inicio==='existente'?m.abertura.caixa:0))),'tot')+finRow('Caixa no fim do ano',k.cash,'tot')+
    `<tr class="sec"><td colspan="${R.H+2}">Fluxos para avaliação</td></tr>`+finRow('FCFF — fluxo livre da empresa',k.fcff,'sub')+finRow('FCFE — fluxo livre do accionista',k.fcfe,'sub')+finRow('CFADS — disponível para serviço da dívida',k.cfads,'sub');}
  return ph('Demonstrações projectadas',`Demonstração de resultados, balanço e fluxos de caixa integrados · classificação PGC Angola · ${unitLbl()}`,`<button class="btn" data-act="copyFS">${ico('copy')}Copiar (CSV)</button>${cenSel()}${unitSel()}`)+
  `<div class="tabs">${[['dr','Demonstração de resultados'],['bal','Balanço'],['fc','Fluxos de caixa']].map(([a,n])=>`<a class="${tab===a?'on':''}" data-act="sub" data-k="dt" data-v="${a}">${n}</a>`).join('')}</div><div class="card"><div class="tblwrap"><table class="ft">${head}<tbody>${body}</tbody></table></div></div>`;};
VIEWS.demonstracoes.after=bindCommon;

/* ---------------- Avaliação ---------------- */
VIEWS.avaliacao=()=>{const m=M(),R=run(m),k=R.k;const ex=m.inicio==='existente';
  const mlo=k.ebitda[1]*m.mult.lo,mhi=k.ebitda[1]*m.mult.hi;
  const gR=[-0.01,0.01].map(dg=>{const mm=clone(m);mm.tv.metodo='gordon';mm.tv.g+=dg*100;return run(mm).npv;});
  const xR=[-1,1].map(dx=>{const mm=clone(m);mm.tv.metodo='multiplo';mm.tv.mult+=dx;return run(mm).npv;});
  const wR=[1.1,0.9].map(f=>run(m,{wacc:f}).npv);
  const adj=v=>ex?v-R.netDebt0:v;
  const rows=[{name:'DCF — sensib. WACC ±10%',lo:adj(wR[0]),hi:adj(wR[1]),range:1,color:'#1d4e89'},{name:'DCF — Gordon (g ±1 p.p.)',lo:adj(Math.min(...gR)),hi:adj(Math.max(...gR)),range:1,color:'#28507f'},{name:'DCF — múltiplo de saída (±1×)',lo:adj(Math.min(...xR)),hi:adj(Math.max(...xR)),range:1,color:'#2a9d8f'},{name:`Múltiplos EV/EBITDA (${m.mult.lo}×–${m.mult.hi}×)`,lo:adj(mlo),hi:adj(mhi),range:1,color:'#e9a23b'}];
  const disc=k.fcff.map((v,t)=>v/Math.pow(1+R.wacc,t));
  return ph('Avaliação',`Fluxos de caixa descontados ao WACC, valor terminal e comparação com múltiplos · ${unitLbl()}`,`${cenSel()}${unitSel()}`)+
  `<div class="grid g4" style="margin-bottom:16px"><div class="card kpi"><div class="l">Valor actual dos FCFF explícitos</div><div class="v">${mv(R.npvSemTv)}</div></div><div class="card kpi"><div class="l">Valor actual do valor terminal</div><div class="v">${mv(R.pvTv)}</div><div class="d">${m.tv.metodo==='gordon'?`Gordon, g = ${m.tv.g}%`:m.tv.metodo==='multiplo'?`${m.tv.mult}× EBITDA ${R.years[R.H]}`:'não aplicado'}</div></div><div class="card kpi"><div class="l">${ex?'Enterprise value (EV)':'VAL do projecto'}</div><div class="v" style="color:${R.ev>=0?'var(--green)':'var(--red)'}">${mv(R.ev)}</div><div class="d">WACC ${pct(R.wacc)}</div></div><div class="card kpi"><div class="l">${ex?'Valor do capital próprio':'TIR projecto'}</div><div class="v">${ex?mv(R.eqVal):pct(R.irr)}</div><div class="d">${ex?`EV − dívida líquida (${mv(R.netDebt0)})`:`índice de rendibilidade ${xf(R.pi)}`}</div></div></div>
  <div class="grid g21"><div class="card"><div class="hd"><h3>Fluxos de caixa descontados</h3></div><div class="tblwrap"><table class="ft"><thead><tr><th>${unitLbl()}</th>${R.years.map(y=>`<th class="num">${y}</th>`).join('')}</tr></thead><tbody>
    ${finRow('EBITDA',k.ebitda)}${finRow('− Imposto sobre o EBIT (desalavancado)',k.taxU.map(v=>-v))}${finRow('− CAPEX',k.capex.map(v=>-v))}${finRow('− Variação do fundo de maneio',k.dnwc.map(v=>-v))}${finRow('FCFF',k.fcff,'tot')}${finRow('Factor de desconto',k.fcff.map((_,t)=>1/Math.pow(1+R.wacc,t)),'kp',v=>v.toFixed(3).replace('.',','))}${finRow('FCFF descontado',disc,'tot')}
  </tbody></table></div></div>
  <div class="card"><div class="hd"><h3>Construção do WACC</h3></div><div class="bd">${m.wacc.modo==='manual'?`<div class="ratio"><span>Taxa definida manualmente</span><b>${pct(R.wacc)}</b></div>`:[['Taxa sem risco',m.wacc.rf/100],['Beta × prémio de mercado',m.wacc.beta*m.wacc.erp/100],['Prémio de risco país',m.wacc.crp/100],['Custo do capital próprio (Ke)',R.ke,1],['Custo da dívida líquido de imposto',m.wacc.kd/100*(1-m.ii/100)],['Peso da dívida',m.wacc.wd/100],['WACC',R.wacc,1]].map(([n,v,b])=>`<div class="ratio"><span>${b?'<b>'+n+'</b>':n}</span><b style="${b?'color:var(--brand)':'font-weight:500'}">${pct(v,2)}</b></div>`).join('')}
  <div class="alert b" style="margin-top:12px">${ico('info',17)}<div>Coerência de moeda: em USD use taxa sem risco e prémio de risco país em USD; em Kz use a taxa das OT em Kz (já incorpora inflação e risco país).</div></div></div></div></div>
  <div class="card" style="margin-top:16px"><div class="hd"><h3>Intervalo de avaliação ${ex?'do capital próprio':'(VAL)'} — football field</h3><span class="muted">${unitLbl()}</span></div><div class="bd">${hBars(rows,{center:ex?R.eqVal:R.npv})}<div class="muted" style="font-size:12px">Linha vertical = valor no cenário e método actuais. Múltiplos aplicados ao EBITDA do ano 1 (${mv(k.ebitda[1])}).</div></div></div>`;};
VIEWS.avaliacao.after=bindCommon;

/* ---------------- Crédito ---------------- */
VIEWS.credito=()=>{const m=M(),R=run(m),k=R.k;const yrs=R.years.map(String);const has=R.hasDebt;
  if(!has)return ph('Financiamento & crédito','Métricas para bancos e financiadores')+`<div class="card"><div class="bd"><div class="alert b">${ico('info',17)}<div>O modelo não tem dívida. Defina um empréstimo em <b>Pressupostos › Financiamento</b> para obter DSCR, LLCR, capacidade de endividamento e teste de covenants.</div></div><div class="ratio"><span>Capacidade indicativa de endividamento (Dívida líquida/EBITDA ${m.cov.ndEbitda}× sobre EBITDA ano 2)</span><b>${money(Math.max(0,k.ebitda[Math.min(2,R.H)]*m.cov.ndEbitda))}</b></div></div></div>`;
  const brk=t=>{const f=[];if(k.dscr[t]!=null&&k.princ[t]>0&&k.dscr[t]<m.cov.dscr)f.push('DSCR');if(R.ndE[t]!=null&&R.ndE[t]>m.cov.ndEbitda)f.push('DL/EBITDA');if(R.icr[t]!=null&&R.icr[t]<m.cov.icr)f.push('ICR');return f;};
  const nb=R.years.filter((_,t)=>t>=1&&k.debt[t-1]>0&&brk(t).length).length;
  return ph('Financiamento & crédito','Perspectiva do financiador: capacidade de serviço da dívida, rácios de cobertura e covenants',`${cenSel()}${unitSel()}`)+
  `<div class="grid g5" style="margin-bottom:16px"><div class="card kpi"><div class="l">DSCR mínimo</div><div class="v" style="color:${R.minDscr>=m.cov.dscr?'var(--green)':'var(--red)'}">${xf(R.minDscr)}</div><div class="d">covenant ≥ ${xf(m.cov.dscr)}</div></div><div class="card kpi"><div class="l">DSCR médio</div><div class="v">${xf(R.avgDscr)}</div></div><div class="card kpi"><div class="l">LLCR</div><div class="v">${xf(R.llcr)}</div><div class="d">VA do CFADS no prazo ÷ dívida</div></div><div class="card kpi"><div class="l">Capacidade de endividamento</div><div class="v">${mv(R.debtCap)}</div><div class="d">ao DSCR ${xf(m.cov.dscr)} · pedido ${mv(m.divida.montante)}</div></div><div class="card kpi"><div class="l">Anos com incumprimento</div><div class="v" style="color:${nb?'var(--red)':'var(--green)'}">${nb}</div><div class="d">de covenants</div></div></div>
  <div class="grid g2"><div class="card"><div class="hd"><h3>DSCR por ano</h3></div><div class="bd">${barChart({labels:yrs,series:[{name:'DSCR',data:k.dscr.map((v,t)=>k.princ[t]>0||k.jur[t]>0?v:null),colorFn:v=>v<m.cov.dscr?'#c44536':'#2a9d8f'}],ref:m.cov.dscr,fmt:v=>v.toFixed(1).replace('.',',')+'×',h:220})}</div></div>
  <div class="card"><div class="hd"><h3>CFADS vs serviço da dívida</h3><span class="muted">${unitLbl()}</span></div><div class="bd">${legend([['CFADS','var(--s2)'],['Serviço da dívida','var(--s4)']])}${barChart({labels:yrs,series:[{name:'CFADS',data:k.cfads,color:'#2a9d8f'},{name:'Serviço da dívida',data:k.ds,color:'#c44536'}],h:220})}</div></div></div>
  <div class="card" style="margin-top:16px"><div class="hd"><h3>Quadro do serviço da dívida e covenants</h3></div><div class="tblwrap"><table class="ft"><thead><tr><th>${unitLbl()}</th>${R.years.map(y=>`<th class="num">${y}</th>`).join('')}</tr></thead><tbody>
   ${finRow('Dívida no início do ano',k.debt.map((d,t)=>t?k.debt[t-1]:0))}${finRow('+ Desembolsos',k.draw)}${finRow('− Reembolsos de capital',k.princ.map(v=>-v))}${finRow('Dívida no fim do ano',k.debt,'tot')}${finRow('Juros',k.jur)}${finRow('Serviço da dívida',k.ds,'tot')}${finRow('CFADS',k.cfads)}
   ${finRow('DSCR',k.dscr.map((v,t)=>k.ds[t]>1?v:null),'',v=>v==null?'—':xf(v))}${finRow('Dívida líquida / EBITDA',R.ndE,'',v=>v==null?'—':xf(v))}${finRow('Cobertura de juros (EBITDA/juros)',R.icr,'',v=>v==null?'—':xf(v))}
   <tr><td><b>Teste de covenants</b></td>${R.years.map((_,t)=>{const f=t>=1&&k.debt[t-1]>0?brk(t):null;return `<td class="num">${f==null?'—':f.length?`<span class="tag r">${f.join(', ')}</span>`:'<span class="tag g">OK</span>'}</td>`}).join('')}</tr>
  </tbody></table></div></div>`;};
VIEWS.credito.after=bindCommon;

/* ---------------- Cenários & sensibilidade ---------------- */
VIEWS.sensibilidade=()=>{const m=M();const d=m.sens/100;const base=run(m);
  const vars=[['preco','Preço de venda'],['volume','Volume / produção'],['cvar','Custos variáveis'],['fixos','Custos fixos'],['capex','CAPEX'],['wacc','WACC']];
  const rows=vars.map(([k,n])=>{const lo=run(m,{[k]:1-d}).npv,hi=run(m,{[k]:1+d}).npv;return {name:`${n} (±${m.sens}%)`,lo,hi,sw:Math.abs(hi-lo)}}).sort((a,b)=>b.sw-a.sw);
  const steps=[-0.2,-0.1,0,0.1,0.2];const grid=steps.map(v=>steps.map(p=>run(m,{volume:1+v,preco:1+p}).npv));const mx=Math.max(...grid.flat().map(Math.abs));
  const cell=v=>{const a=Math.min(1,Math.abs(v)/mx);return v>=0?`rgba(35,132,90,${0.12+a*0.55})`:`rgba(192,57,43,${0.12+a*0.55})`};

  ${kcard('DSCR mínimo',xf(R.minDscr),R.hasDebt?'covenant '+xf(m.cov.dscr):'sem dívida')+kcard('Margem EBITDA (ano '+Math.min(3,R.H)+')',pct(k.rev[Math.min(3,R.H)]?k.ebitda[Math.min(3,R.H)]/k.rev[Math.min(3,R.H)]:null))+kcard('Capital adicional necessário',money(R.fundingGap))}</div>
  <h3>Evolução das receitas, EBITDA e resultado líquido</h3>${legend([['Receitas','#1d4e89'],['EBITDA','#2a9d8f'],['Resultado líquido','#e9a23b']])}${barChart({labels:R.years.map(String),series:[{name:'Receitas',data:k.rev,color:'#1d4e89'},{name:'EBITDA',data:k.ebitda,color:'#2a9d8f'},{name:'RL',data:k.rl,color:'#e9a23b'}],h:190})}
  <h3>Indicadores-chave</h3>${rtable(R,[['Volume de negócios',t=>mv(k.rev[t])],['EBITDA',t=>mv(k.ebitda[t])],['Margem EBITDA',t=>pct(k.rev[t]?k.ebitda[t]/k.rev[t]:null)],['Resultado líquido',t=>mv(k.rl[t])],['Fluxo de caixa livre (FCFF)',t=>mv(k.fcff[t])],['Dívida líquida / EBITDA',t=>xf(R.ndE[t])]],ys)}
  <h3>Conclusão</h3>${vtxt(V.inv)}${V.bank?vtxt(V.bank):''}${FTM('Sumário executivo · gerado do modelo')}</div>`;}},
 comite:{t:'Memorando para comité de investimento',d:'Decisão de investimento: pressupostos, retorno, riscos e recomendação',aud:'Comité / Conselho',f:(m,R)=>{const k=R.k,V=verdict(m,R),ys=pickY(R),su=sourcesUses(m,R),tor=tornadoRows(m).slice(0,4);const risks=[...(RISCOS[m.sector]||[]),...modelRisks(m,R)];const be=V.be;
  const rec=V.inv.c==='g'&&(!V.bank||V.bank.c!=='r')?'Aprovar':V.inv.c==='r'?'Não aprovar nas condições actuais':'Aprovar com condições';
  const cond=[];if(R.fundingGap>0)cond.push(`compromisso firme dos sócios para ${money(R.fundingGap)} adicionais`);if(R.minDscr!=null&&R.minDscr<m.cov.dscr)cond.push('reestruturação do financiamento para cumprir o DSCR mínimo');if(be!=null&&1-be<0.2)cond.push('validação independente do preço de venda e dos volumes');
  return `<div class="page">${LHM('CI-'+m.id.slice(0,5).toUpperCase())}<h1>Memorando para o comité de investimento</h1><div class="subt">${esc(m.nome)} · Para decisão</div>
  <h3>1. Objecto e recomendação</h3><p>Submete-se à apreciação do comité ${m.inicio==='existente'?'a avaliação da empresa':'o projecto'} <b>${esc(m.nome)}</b>, no sector de ${SECT[m.sector]?.t.toLowerCase()}. <b>Recomendação: ${rec}</b>${cond.length?', sujeito a: '+cond.join('; '):''}.</p>
  <h3>2. Pressupostos-chave</h3><table class="t"><tr><th>Pressuposto</th><th>Valor</th><th>Pressuposto</th><th>Valor</th></tr>
   <tr><td>Horizonte / início da operação</td><td>${m.horizonte} anos / ano ${m.inicioOp}</td><td>Inflação / escalada</td><td>${String(m.inflacao).replace('.',',')}% a.a.</td></tr>
   ${m.receitas.map(r=>`<tr><td>${esc(r.nome)} — volume pleno</td><td>${nf(r.qtd)} ${esc(r.unid)}</td><td>Preço / escalada</td><td>${nf(r.preco,m.moeda==='USD'?2:0)} ${m.moeda} / ${String(r.esc).replace('.',',')}%</td></tr>`).join('')}
   <tr><td>Custos variáveis</td><td>${String(m.cvar).replace('.',',')}% das receitas</td><td>Royalties / imposto s/ produção</td><td>${String(m.royalty).replace('.',',')}%</td></tr><tr><td>Custos fixos (ano 1)</td><td>${money(m.pessoal+m.fst+m.outros)}</td><td>Imposto Industrial</td><td>${m.ii}%</td></tr>
   <tr><td>Prazos (receb. / exist. / pag.)</td><td>${m.dso} / ${m.dio} / ${m.dpo} dias</td><td>Taxa de desconto (WACC)</td><td>${pct(R.wacc)}</td></tr></table>
  <h3>3. Investimento e financiamento</h3>${suTable(su)}
  <h3>4. Desempenho financeiro projectado</h3>${rtable(R,[['Volume de negócios',t=>mv(k.rev[t])],['EBITDA',t=>mv(k.ebitda[t])],['Resultado líquido',t=>mv(k.rl[t])],['FCFF',t=>mv(k.fcff[t])],['Caixa no fim do ano',t=>mv(k.cash[t])]],ys)}
  <h3>5. Retorno e avaliação</h3><div class="two" style="grid-template-columns:repeat(4,1fr)">${kcard('VAL',money(R.npv))}${kcard('TIR projecto',pct(R.irr),'vs WACC '+pct(R.wacc))}${kcard('TIR accionista',pct(R.irrEq),'vs Ke '+pct(R.ke))}${kcard('Payback',R.pb!=null?R.pb.toFixed(1).replace('.',',')+' anos':'—')}</div>
  <h3>6. Sensibilidade</h3><table class="t"><tr><th>Variável</th><th class="n">VAL (−)</th><th class="n">VAL (+)</th><th class="n">Amplitude</th></tr>${tor.map(r=>`<tr><td>${r.name}</td><td class="n">${mv(r.lo)}</td><td class="n">${mv(r.hi)}</td><td class="n">${mv(r.sw)}</td></tr>`).join('')}</table>${be!=null?`<p style="font-family:Inter;font-size:11.5px">O VAL anula-se com uma queda de <b>${pct(1-be,0)}</b> no preço face ao cenário analisado.</p>`:''}
  <h3>7. Riscos e mitigação</h3><table class="t"><tr><th>Risco</th><th>Mitigação proposta</th></tr>${risks.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>
  <h3>8. Deliberação do comité</h3><div class="box" style="display:flex;gap:26px">☐ Aprovado &nbsp; ☐ Aprovado com condições &nbsp; ☐ Rejeitado &nbsp; ☐ Adiado para nova análise</div>
  ${SGM(['Proposto por','Direcção Financeira'],['Presidente do comité','Data: ____/____/______'])}${FTM('Memorando ao comité de investimento')}</div>`;}},
 credito:{t:'Memorando de crédito',d:'Pedido de financiamento ao banco: capacidade de reembolso e covenants',aud:'Bancos / financiadores',f:(m,R)=>{const k=R.k,d=m.divida;const su=sourcesUses(m,R);const V=verdict(m,R);
  if(!R.hasDebt)return `<div class="page">${LHM('MC')}<h1>Memorando de crédito</h1><div class="subt">&nbsp;</div><div class="box">O modelo não inclui dívida. Defina o empréstimo em Pressupostos › Financiamento para gerar o memorando de crédito. Capacidade indicativa (Dívida líquida/EBITDA ${m.cov.ndEbitda}× sobre o EBITDA do ano 2): <b>${money(Math.max(0,k.ebitda[Math.min(2,R.H)]*m.cov.ndEbitda))}</b>.</div>${FTM('Memorando de crédito')}</div>`;
  const yrs=[...Array(R.H+1).keys()].filter(t=>k.ds[t]>1);const maxND=Math.max(...R.ndE.filter(v=>v!=null)),minICR=Math.min(...R.icr.filter(v=>v!=null));
  return `<div class="page">${LHM('MC-'+m.id.slice(0,5).toUpperCase())}<h1>Memorando de pedido de financiamento</h1><div class="subt">${esc(m.nome)}</div>
  <h3>1. Mutuário e operação proposta</h3><table class="t"><tr><td style="width:34%">Mutuário</td><td><b>${m.promotor?esc(m.promotor):'<i style="color:#b7791f">[Entidade promotora — NIF]</i>'}</b></td></tr><tr><td>Finalidade</td><td>Financiamento ${m.inicio==='existente'?'da actividade e expansão':'do investimento'} — ${esc(m.nome)}</td></tr><tr><td>Montante</td><td><b>${money(d.montante)}</b> (${pct(d.montante/(d.montante+(+m.capitalInicial||0)),0)} das fontes de capital)</td></tr><tr><td>Prazo / carência</td><td>${d.prazo} anos, dos quais ${d.carencia} de carência de capital; reembolso em prestações anuais constantes de capital</td></tr><tr><td>Taxa de juro</td><td>${d.taxa}% a.a. · desembolso no ano ${d.ano} (${R.years[d.ano]})</td></tr></table>
  <h3>2. Fontes e aplicações</h3>${suTable(su)}
  <h3>3. Capacidade de reembolso</h3><table class="t"><tr><th>${unitLbl()}</th>${yrs.map(t=>`<th class="n">${R.years[t]}</th>`).join('')}</tr><tr><td>CFADS</td>${yrs.map(t=>`<td class="n">${mv(k.cfads[t])}</td>`).join('')}</tr><tr><td>Juros</td>${yrs.map(t=>`<td class="n">${mv(k.jur[t])}</td>`).join('')}</tr><tr><td>Capital</td>${yrs.map(t=>`<td class="n">${mv(k.princ[t])}</td>`).join('')}</tr><tr class="tot"><td>Serviço da dívida</td>${yrs.map(t=>`<td class="n">${mv(k.ds[t])}</td>`).join('')}</tr><tr><td>DSCR</td>${yrs.map(t=>`<td class="n" style="color:${k.dscr[t]!=null&&k.dscr[t]<m.cov.dscr?'#c0392b':'inherit'}">${xf(k.dscr[t])}</td>`).join('')}</tr><tr><td>Dívida no fim do ano</td>${yrs.map(t=>`<td class="n">${mv(k.debt[t])}</td>`).join('')}</tr></table>
  ${barChart({labels:R.years.map(String),series:[{name:'CFADS',data:k.cfads,color:'#2a9d8f'},{name:'Serviço da dívida',data:k.ds,color:'#c44536'}],h:160})}
  <h3>4. Rácios e covenants propostos</h3><table class="t"><tr><th>Rácio</th><th class="n">Covenant</th><th class="n">Projectado</th><th>Situação</th></tr><tr><td>DSCR mínimo</td><td class="n">≥ ${xf(m.cov.dscr)}</td><td class="n">${xf(R.minDscr)}</td><td>${R.minDscr>=m.cov.dscr?'<span class="tg">Cumpre</span>':'<span class="tg r">Não cumpre</span>'}</td></tr><tr><td>DSCR médio</td><td class="n">—</td><td class="n">${xf(R.avgDscr)}</td><td></td></tr><tr><td>LLCR</td><td class="n">≥ ${xf(m.cov.dscr)}</td><td class="n">${xf(R.llcr)}</td><td>${R.llcr>=m.cov.dscr?'<span class="tg">Cumpre</span>':'<span class="tg r">Não cumpre</span>'}</td></tr><tr><td>Dívida líquida / EBITDA (máximo)</td><td class="n">≤ ${xf(m.cov.ndEbitda)}</td><td class="n">${xf(maxND)}</td><td>${maxND<=m.cov.ndEbitda?'<span class="tg">Cumpre</span>':'<span class="tg a">Excede em algum ano</span>'}</td></tr><tr><td>Cobertura de juros (mínimo)</td><td class="n">≥ ${xf(m.cov.icr)}</td><td class="n">${xf(minICR)}</td><td>${minICR>=m.cov.icr?'<span class="tg">Cumpre</span>':'<span class="tg a">Abaixo em algum ano</span>'}</td></tr></table>
  ${R.debtCap!=null?`<p style="font-family:Inter;font-size:11.5px">Capacidade de endividamento ao DSCR de ${xf(m.cov.dscr)}: <b>${money(R.debtCap)}</b> (pedido: ${money(d.montante)}).</p>`:''}
  <h3>5. Garantias propostas</h3><p style="font-family:Inter;font-size:11.5px;color:#b7791f">[Hipoteca dos imóveis · penhor dos equipamentos financiados · consignação de receitas / conta de reserva do serviço da dívida (DSRA) · aval / carta de conforto dos sócios]</p>
  <h3>6. Parecer</h3>${V.bank?vtxt(V.bank):''}${SGM(['Pelo mutuário','Gerência'],['Direcção Financeira','Responsável pelo modelo'])}${FTM('Memorando de crédito')}</div>`;}},
 avaliacao:{t:'Relatório de avaliação',d:'DCF, WACC, valor terminal e múltiplos',aud:'Investidores / M&A',land:1,f:(m,R)=>{const k=R.k,ex=m.inicio==='existente';const disc=k.fcff.map((v,t)=>v/Math.pow(1+R.wacc,t));const mlo=k.ebitda[1]*m.mult.lo,mhi=k.ebitda[1]*m.mult.hi;const wR=[1.1,0.9].map(f=>run(m,{wacc:f}).npv);const adj=v=>ex?v-R.netDebt0:v;
  return `<div class="page land">${LHM('AV-'+m.id.slice(0,5).toUpperCase())}<h1>Relatório de avaliação</h1><div class="subt">${esc(m.nome)} · método dos fluxos de caixa descontados (DCF) com verificação por múltiplos</div>
  <div><div><h3>1. Fluxos de caixa livres da empresa (FCFF)</h3><table class="t"><tr><th>${unitLbl()}</th>${R.years.map(y=>`<th class="n">${y}</th>`).join('')}</tr>${[['EBITDA',k.ebitda],['− Imposto sobre EBIT',k.taxU.map(v=>-v)],['− CAPEX',k.capex.map(v=>-v)],['− Δ Fundo de maneio',k.dnwc.map(v=>-v)]].map(([n,a])=>`<tr><td>${n}</td>${a.map(v=>`<td class="n">${mv(v)}</td>`).join('')}</tr>`).join('')}<tr class="tot"><td>FCFF</td>${k.fcff.map(v=>`<td class="n">${mv(v)}</td>`).join('')}</tr><tr><td>FCFF descontado</td>${disc.map(v=>`<td class="n">${mv(v)}</td>`).join('')}</tr></table></div>
  </div>
  <div class="two" style="grid-template-columns:1fr 1fr 1.2fr"><div><h3>2. Taxa de desconto</h3><table class="t">${m.wacc.modo==='manual'?`<tr><td>Taxa definida</td><td class="n">${pct(R.wacc,2)}</td></tr>`:[['Taxa sem risco',m.wacc.rf/100],['Beta',null,m.wacc.beta],['Prémio de mercado',m.wacc.erp/100],['Prémio de risco país',m.wacc.crp/100],['Custo do capital próprio',R.ke],['Custo da dívida (líq.)',m.wacc.kd/100*(1-m.ii/100)],['Peso da dívida',m.wacc.wd/100]].map(([n,v,x])=>`<tr><td>${n}</td><td class="n">${x!=null?String(x).replace('.',','):pct(v,2)}</td></tr>`).join('')+`<tr class="tot"><td>WACC</td><td class="n">${pct(R.wacc,2)}</td></tr>`}</table></div><div><h3>3. Da avaliação da empresa ao capital próprio</h3><table class="t"><tr><td>VA dos FCFF explícitos</td><td class="n">${mv(R.npvSemTv)}</td></tr><tr><td>VA do valor terminal (${m.tv.metodo==='gordon'?'Gordon, g = '+m.tv.g+'%':m.tv.metodo==='multiplo'?m.tv.mult+'× EBITDA':'não aplicado'})</td><td class="n">${mv(R.pvTv)}</td></tr><tr class="tot"><td>${ex?'Enterprise value':'VAL do projecto'}</td><td class="n">${mv(R.ev)}</td></tr>${ex?`<tr><td>− Dívida líquida de abertura</td><td class="n">${mv(-R.netDebt0)}</td></tr><tr class="tot"><td>Valor do capital próprio</td><td class="n">${mv(R.eqVal)}</td></tr><tr><td>Capitais próprios contabilísticos</td><td class="n">${mv(R.bookEq)}</td></tr>`:''}</table></div>
  <div><h3>4. Intervalo de valor</h3><table class="t"><tr><th>Método</th><th class="n">Mínimo</th><th class="n">Máximo</th></tr><tr><td>DCF (WACC ±10%)</td><td class="n">${mv(adj(wR[0]))}</td><td class="n">${mv(adj(wR[1]))}</td></tr><tr><td>EV/EBITDA ${m.mult.lo}×–${m.mult.hi}× (EBITDA ${R.years[1]})</td><td class="n">${mv(adj(mlo))}</td><td class="n">${mv(adj(mhi))}</td></tr><tr class="tot"><td>Valor central (DCF)</td><td class="n" colspan="2">${mv(ex?R.eqVal:R.npv)}</td></tr></table></div></div>
  <p style="font-family:Inter;font-size:11.5px">Conclusão: ${ex?`o valor do capital próprio situa-se entre <b>${money(Math.min(adj(wR[0]),adj(mlo)))}</b> e <b>${money(Math.max(adj(wR[1]),adj(mhi)))}</b>, com valor central de <b>${money(R.eqVal)}</b>.`:`o projecto apresenta VAL de <b>${money(R.npv)}</b> (intervalo ${money(wR[0])} a ${money(wR[1])} com o WACC ±10%) e TIR de ${pct(R.irr)}.`} Estimativa baseada nos pressupostos do modelo; não constitui opinião de auditoria.</p>${FTM('Relatório de avaliação')}</div>`;}},
 demonstracoes:{t:'Demonstrações financeiras projectadas',d:'Anexo: DR, Balanço e Fluxos de caixa (PGC Angola)',aud:'Anexo técnico',land:1,f:(m,R)=>{const k=R.k;const row=(n,a,c='')=>`<tr class="${c}"><td>${n}</td>${a.map(v=>`<td class="n">${mv(v)}</td>`).join('')}</tr>`;const th=`<tr><th>${unitLbl()}</th>${R.years.map(y=>`<th class="n">${y}</th>`).join('')}</tr>`;const n=a=>a.map(v=>-v);
  const p1=`<div class="page land">${LHM('DF-1')}<h1>Demonstração de resultados projectada</h1><div class="subt">Classificação por natureza — PGC Angola (Decreto n.º 82/2001)</div><table class="t">${th}${row('Volume de negócios (classe 6)',k.rev,'tot')}${row('71 · Custo das existências vendidas e consumidas',n(k.cv))}${m.royalty?row('75 · Royalties / imposto sobre a produção',n(k.roy)):''}${row('72 · Custos com o pessoal',n(k.pes))}${row('75.2 · Fornecimentos e serviços de terceiros',n(k.fst))}${row('75 · Outros custos operacionais',n(k.out))}${row('EBITDA',k.ebitda,'tot')}${row('73 · Amortizações',n(k.da))}${row('Resultado operacional',k.ebit,'tot')}${row('76 · Custos financeiros',n(k.jur))}${row('Resultado antes de impostos',k.ebt,'tot')}${row('87 · Imposto sobre os lucros',n(k.imp))}${row('Resultado líquido do exercício',k.rl,'tot')}</table>${FTM('Demonstrações projectadas · 1/3')}</div>`;
  const p2=`<div class="page land">${LHM('DF-2')}<h1>Balanço projectado</h1><div class="subt">${unitLbl()}</div><table class="t">${th}${row('Classe 1 · Imobilizado líquido',k.imob)}${row('Classe 2 · Existências',k.inv)}${row('31 · Clientes',k.ar)}${row('Classe 4 · Meios monetários',k.cash)}${row('Total do activo',k.assets,'tot')}${row('51 · Capital',k.cap)}${row('81/88 · Resultados acumulados',k.res)}${row('Total do capital próprio',k.cap.map((c,i)=>c+k.res[i]),'tot')}${row('33 · Empréstimos obtidos',k.debt)}${row('32 · Fornecedores',k.ap)}${row('Total do capital próprio e passivo',k.le,'tot')}<tr><td>Verificação</td>${k.check.map(v=>`<td class="n">${Math.abs(v)<1?'✓':mv(v)}</td>`).join('')}</tr></table>${FTM('Demonstrações projectadas · 2/3')}</div>`;
  const p3=`<div class="page land">${LHM('DF-3')}<h1>Demonstração de fluxos de caixa projectada</h1><div class="subt">Método indirecto</div><table class="t">${th}${row('Resultado líquido',k.rl)}${row('+ Amortizações',k.da)}${row('− Variação do fundo de maneio',n(k.dnwc))}${row('Fluxo operacional',k.cfo,'tot')}${row('CAPEX',n(k.capex))}${row('Fluxo de investimento',k.cfi,'tot')}${row('Capital e suprimentos',k.eqInj.map((v,i)=>v+k.eqAuto[i]))}${row('Desembolsos de dívida',k.draw)}${row('Reembolsos de dívida',n(k.princ))}${row('Dividendos',n(k.div))}${row('Fluxo de financiamento',k.cff,'tot')}${row('Caixa no fim do ano',k.cash,'tot')}${row('FCFF',k.fcff)}${row('FCFE',k.fcfe)}${row('CFADS',k.cfads)}</table>${FTM('Demonstrações projectadas · 3/3')}</div>`;
  return p1+p2+p3;}},
 cenarios:{t:'Análise de cenários e sensibilidade',d:'Base, optimista, pessimista, tornado e pontos de equilíbrio',aud:'Investidores / comité',f:(m,R)=>{const tor=tornadoRows(m);const cs=[['base','Base'],['otim','Optimista'],['pess','Pessimista']].map(([c,n])=>[n,run(m,{cen:c}),m.cenarios[c]]);const be=breakEvenPrice(m);const steps=[-0.2,-0.1,0,0.1,0.2];
  return `<div class="page">${LHM('CS-'+m.id.slice(0,5).toUpperCase())}<h1>Análise de cenários e sensibilidade</h1><div class="subt">${esc(m.nome)}</div>
  <h3>1. Cenários</h3><table class="t"><tr><th>Cenário</th><th class="n">Preço</th><th class="n">Volume</th><th class="n">Opex</th><th class="n">CAPEX</th><th class="n">VAL</th><th class="n">TIR</th><th class="n">DSCR mín.</th><th class="n">Capital adic.</th></tr>${cs.map(([n,r,c])=>`<tr><td><b>${n}</b></td>${['preco','volume','opex','capex'].map(f=>`<td class="n">${String(c[f]).replace('.',',')}×</td>`).join('')}<td class="n">${mv(r.npv)}</td><td class="n">${pct(r.irr)}</td><td class="n">${xf(r.minDscr)}</td><td class="n">${mv(r.fundingGap)}</td></tr>`).join('')}</table>
  <h3>2. Gráfico tornado — impacto no VAL (±${m.sens}%)</h3>${hBars(tor,{center:R.npv,h0:30})}
  <h3>3. Matriz preço × volume — VAL</h3><table class="t"><tr><th>Volume \\ Preço</th>${steps.map(p=>`<th class="n">${p>0?'+':''}${p*100}%</th>`).join('')}</tr>${steps.map(v=>`<tr><td><b>${v>0?'+':''}${v*100}%</b></td>${steps.map(p=>{const x=run(m,{volume:1+v,preco:1+p}).npv;return `<td class="n" style="color:${x<0?'#c0392b':'inherit'};${v===0&&p===0?'font-weight:700':''}">${mv(x)}</td>`}).join('')}</tr>`).join('')}</table>
  <h3>4. Pontos de equilíbrio</h3><table class="t"><tr><td>Preço que anula o VAL</td><td class="n">${be!=null?pct(be,0)+' do preço do cenário':'—'}</td></tr>${m.receitas.map(r=>`<tr><td>${esc(r.nome)} — preço de equilíbrio</td><td class="n">${be!=null?nf(r.preco*be*R.sc.preco,m.moeda==='USD'?2:0)+' '+m.moeda+'/'+esc(r.unid):'—'}</td></tr>`).join('')}<tr><td>Variável mais crítica</td><td class="n">${tor[0].name.replace(/ \(.*/,'')}</td></tr></table>${FTM('Cenários e sensibilidade')}</div>`;}},
 divida:{t:'Quadro de serviço da dívida',d:'Plano de amortização, juros e cobertura ano a ano',aud:'Bancos / tesouraria',f:(m,R)=>{const k=R.k,d=m.divida;const ys=[...Array(R.H+1).keys()].filter(t=>k.debt[t]>0||k.ds[t]>0||(t&&k.debt[t-1]>0));
  return `<div class="page">${LHM('SD-'+m.id.slice(0,5).toUpperCase())}<h1>Quadro de serviço da dívida</h1><div class="subt">${R.hasDebt?`Empréstimo de ${money(d.montante)} · ${d.taxa}% · ${d.prazo} anos (${d.carencia} de carência)`:'Sem dívida no modelo'}</div>
  <table class="t"><tr><th>Ano</th><th class="n">Saldo inicial</th><th class="n">Desembolso</th><th class="n">Juros</th><th class="n">Capital</th><th class="n">Prestação</th><th class="n">Saldo final</th><th class="n">CFADS</th><th class="n">DSCR</th></tr>${ys.map(t=>`<tr><td>${R.years[t]}</td><td class="n">${mv(t?k.debt[t-1]:0)}</td><td class="n">${mv(k.draw[t])}</td><td class="n">${mv(k.jur[t])}</td><td class="n">${mv(k.princ[t])}</td><td class="n">${mv(k.ds[t])}</td><td class="n">${mv(k.debt[t])}</td><td class="n">${mv(k.cfads[t])}</td><td class="n">${xf(k.dscr[t])}</td></tr>`).join('')}
  <tr class="tot"><td>Total</td><td></td><td class="n">${mv(k.draw.reduce((a,b)=>a+b,0))}</td><td class="n">${mv(k.jur.reduce((a,b)=>a+b,0))}</td><td class="n">${mv(k.princ.reduce((a,b)=>a+b,0))}</td><td class="n">${mv(k.ds.reduce((a,b)=>a+b,0))}</td><td></td><td></td><td></td></tr></table>
  ${R.hasDebt?barChart({labels:R.years.map(String),series:[{name:'DSCR',data:k.dscr,colorFn:v=>v<m.cov.dscr?'#c44536':'#2a9d8f'}],ref:m.cov.dscr,fmt:v=>v.toFixed(1).replace('.',',')+'×',h:170}):''}
  <p style="font-family:Inter;font-size:11.5px">Custo total do financiamento (juros): <b>${money(k.jur.reduce((a,b)=>a+b,0))}</b>. Juros no ano de desembolso calculados sobre metade do montante (desembolso a meio do ano).</p>${FTM('Quadro de serviço da dívida')}</div>`;}},
 analise:{t:'Relatório de análise económico-financeira',d:'Histórico: balancetes PGC, rácios e diagnóstico',aud:'Investidores / bancos',hist:1,f:()=>{const A=analyze();if(!A||A.err)return `<div class="page">${LHM('AEF')}<h1>Relatório de análise económico-financeira</h1><div class="subt">&nbsp;</div><div class="box">Ainda não há balancetes analisados. Carregue-os em <b>Análise de demonstrações</b> (ou use o exemplo) para gerar este relatório.</div>${FTM('Análise económico-financeira')}</div>`;
  const {cN,c1,rN,r1}=A;const a=S.an;const two=!!c1;const r=(n,f)=>`<tr><td>${n}</td>${two?`<td class="n">${fmtA(f(c1))}</td>`:''}<td class="n">${fmtA(f(cN))}</td>${two?`<td class="n">${f(c1)?pct(f(cN)/f(c1)-1):'—'}</td>`:''}</tr>`;const th=`<tr><th>${a.moeda} · milhões</th>${two?`<th class="n">${esc(a.anos[0])}</th>`:''}<th class="n">${esc(a.anos[1])}</th>${two?'<th class="n">Var.</th>':''}</tr>`;
  const groups=[...new Set(RDEF.map(x=>x[0]))];
  return `<div class="page"><div class="lh"><div class="lhco"><div class="mk">I</div><div><b>${esc(a.empresa||'Empresa analisada')}</b><small>Análise económico-financeira · PGC Angola</small></div></div><div class="rt">Exercícios ${two?esc(a.anos[0])+' e ':''}${esc(a.anos[1])}<br>Luanda, ${new Date().toLocaleDateString('pt-PT',{day:'numeric',month:'long',year:'numeric'})}</div></div><h1>Relatório de análise económico-financeira</h1><div class="subt">${esc(a.empresa||'')}</div>
  <div class="two"><div><h3>Balanço (síntese)</h3><table class="t">${th}${r('Activo não corrente',c=>c.B.anc)}${r('Activo corrente',c=>c.B.ac)}${r('Total do activo',c=>c.B.activo)}${r('Capital próprio',c=>c.B.cp)}${r('Passivo não corrente',c=>c.B.pnc)}${r('Passivo corrente',c=>c.B.pc)}</table></div>
  <div><h3>Demonstração de resultados (síntese)</h3><table class="t">${th}${r('Volume de negócios',c=>c.P.vn)}${r('Margem bruta',c=>c.P.mb)}${r('EBITDA',c=>c.P.ebitda)}${r('Resultado operacional',c=>c.P.ro)}${r('Resultados financeiros',c=>c.P.rf)}${r('Resultado líquido',c=>c.P.rl)}</table></div></div>
  <h3>Rácios</h3><table class="t"><tr><th>Área</th><th>Rácio</th>${r1?`<th class="n">${esc(a.anos[0])}</th>`:''}<th class="n">${esc(a.anos[1])}</th><th>Avaliação</th></tr>${RDEF.map(([g,k,n,f,t])=>{const s=rStatus(rN[k],t,f.includes('i'));return `<tr><td>${g}</td><td>${n}</td>${r1?`<td class="n">${rFmt(r1[k],f)}</td>`:''}<td class="n">${rFmt(rN[k],f)}</td><td><span class="tg ${s==='g'?'':s==='a'?'a':s==='r'?'r':'n'}">${({g:'Favorável',a:'Atenção',r:'Desfavorável',n:'—'})[s]}</span></td></tr>`}).join('')}</table>
  <h3>Diagnóstico e recomendações</h3><table class="t"><tr><th>Indicador</th><th>Leitura</th></tr><tr><td>Liquidez</td><td>Liquidez geral de ${xf(rN.lg)}; tesouraria líquida de ${fmtA(rN.tl)} M — ${rN.tl>0?'o fundo de maneio financia as necessidades cíclicas':'necessidades cíclicas financiadas a curto prazo'}.</td></tr><tr><td>Estrutura</td><td>Autonomia financeira de ${pct(rN.af)}; dívida líquida/EBITDA de ${xf(rN.dle)} — ${rN.dle!=null&&rN.dle<=2.5?'capacidade para novo endividamento':'margem reduzida para nova dívida'}.</td></tr><tr><td>Rendibilidade</td><td>Margem EBITDA de ${pct(rN.me)} e ROE de ${pct(rN.roe)}${r1?` (${pct(r1.roe)} no exercício anterior)`:''}.</td></tr><tr><td>Actividade</td><td>Ciclo de conversão de caixa de ${nf(rN.cc)} dias (PMR ${nf(rN.pmr)}, PME ${nf(rN.pme)}, PMP ${nf(rN.pmp)}).</td></tr></table>
  ${SGM(['Elaborado por','Direcção Financeira'],['Revisto por','____________________'])}${FTM('Análise económico-financeira')}</div>`;}},
};
VIEWS.relatorios=()=>{const m=M();const R=run(m);const cur=SUB.rep||'sumario';const rp=REPS[cur];
  return ph('Relatórios',`Documentos gerados do modelo activo (${esc(m.nome)}) e do cenário seleccionado · actualizam ao alterar pressupostos`,`${cenSel()}${unitSel()}<button class="btn" data-act="repCopy">${ico('copy')}Copiar texto</button>`)+
  `<div style="display:grid;grid-template-columns:270px 1fr;gap:18px;align-items:start"><div class="card" style="position:sticky;top:76px"><div class="bd" style="padding:8px">${Object.entries(REPS).map(([k,r])=>`<div data-act="sub" data-k="rep" data-v="${k}" style="padding:9px 10px;border-radius:8px;cursor:pointer;${k===cur?'background:var(--brandSoft)':''}"><b style="font-size:13px;color:${k===cur?'var(--brand)':'inherit'}">${r.t}</b><div class="muted" style="font-size:11.5px">${r.aud}${r.hist?' · histórico':''}</div></div>`).join('')}</div></div>
  <div class="docv">${!m.promotor&&['credito','comite'].includes(cur)?`<div class="dnote">Indique a <b>entidade promotora</b> em Pressupostos › Geral para a incluir no cabeçalho e no memorando.</div>`:''}${rp.f(m,R)}</div></div>`;};
VIEWS.relatorios.after=bindCommon;

/* ---------------- Modal ---------------- */
function openModal(t,b,f,w){$('#modal').style.maxWidth=w||'820px';$('#modal').innerHTML=`<div class="mh"><h3>${t}</h3><button class="x" data-act="close">×</button></div><div class="mb">${b}</div>${f?`<div class="mf">${f}</div>`:''}`;$('#ov').classList.add('on');}
const closeModal=()=>$('#ov').classList.remove('on');
function fsCSV(){const m=M(),R=run(m),k=R.k;const L=[['Rubrica',...R.years]];const add=(n,a)=>L.push([n,...a.map(v=>v.toFixed(2).replace('.',','))]);
  add('Volume de negócios',k.rev);add('Custos variáveis (71)',k.cv);add('Royalties',k.roy);add('Pessoal (72)',k.pes);add('FST (75.2)',k.fst);add('Outros custos (75)',k.out);add('EBITDA',k.ebitda);add('Amortizações (73)',k.da);add('Resultado operacional',k.ebit);add('Juros (76)',k.jur);add('RAI',k.ebt);add('Imposto (87)',k.imp);add('Resultado líquido',k.rl);
  add('Imobilizado líquido',k.imob);add('Existências',k.inv);add('Clientes',k.ar);add('Caixa',k.cash);add('Capital',k.cap);add('Resultados acumulados',k.res);add('Empréstimos',k.debt);add('Fornecedores',k.ap);add('FC operacional',k.cfo);add('FC investimento',k.cfi);add('FC financiamento',k.cff);add('FCFF',k.fcff);add('FCFE',k.fcfe);add('CFADS',k.cfads);
  return L.map(r=>r.join(';')).join('\n');}
async function copyTxt(t,msg){try{await navigator.clipboard.writeText(t);toast(msg)}catch(e){openModal('Copiar',`<textarea class="inp" style="width:100%;height:300px">${esc(t)}</textarea>`,'<button class="btn pri" data-act="close">Fechar</button>')}}

/* ---------------- Eventos ---------------- */
document.addEventListener('click',ev=>{const g=ev.target.closest('[data-go]');if(g)return go(g.dataset.go);if(ev.target.id==='ov')return closeModal();
  const a=ev.target.closest('[data-act]');if(!a)return;const d=a.dataset;const m=M();
  const A={close:closeModal,sub:()=>{SUB[d.k]=d.v;render()},
   newM:()=>openModal('Novo modelo financeiro',`<div class="form" style="margin-bottom:14px"><div class="f w2"><label>Nome</label><input class="inp" id="nmN" placeholder="ex.: Expansão da unidade de Benguela"></div><div class="f w2"><label>Ponto de partida</label><select class="sel" id="nmI"><option value="greenfield">Projecto novo (greenfield)</option><option value="existente">Empresa existente (avaliação / expansão)</option></select></div></div><label style="font-size:12px;font-weight:600;color:var(--ink2)">Core business — o modelo arranca com a estrutura típica do sector (tudo editável)</label><div class="sect" style="margin-top:8px">${Object.entries(SECT).map(([k,s],i)=>`<label><input type="radio" name="nmS" value="${k}" ${i===0?'checked':''}><b>${s.t}</b><small>${s.d}</small><div style="margin-top:6px"><span class="tag n">${s.moeda}</span></div></label>`).join('')}</div>`,`<button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="createM">Criar modelo</button>`),
   createM:()=>{const sk=document.querySelector('[name=nmS]:checked').value;const nm=newModel(sk);const n=$('#nmN').value.trim();if(n)nm.nome=n;nm.inicio=$('#nmI').value;if(nm.inicio==='existente'){nm.inicioOp=1;const k=run(nm).k;nm.abertura={imob:nm.capex.reduce((s,c)=>s+ +c.valor,0)*0.6,vidaRem:8,exist:k.inv[2]||0,clientes:k.ar[2]||0,caixa:nm.caixaMin*2,fornec:k.ap[2]||0,divida:nm.divida.montante*0.5,divTaxa:nm.divida.taxa,divPrazo:4};nm.capex=[];nm.divida.montante=0;nm.receitas.forEach(r=>r.ramp='100');if(nm.tv.metodo==='nenhum')nm.tv.metodo='gordon';}
     S.models.push(nm);S.active=nm.id;save();closeModal();go('pressupostos');toast('Modelo criado a partir do sector '+SECT[sk].t);},
   dupM:()=>{const c=clone(m);c.id=uid();c.nome=m.nome+' (cópia)';S.models.push(c);S.active=c.id;save();render();toast('Modelo duplicado')},
   delM:()=>{if(S.models.length<2)return toast('Mantenha pelo menos um modelo');S.models=S.models.filter(x=>x.id!==m.id);S.active=S.models[0].id;save();render();},
   addRev:()=>{m.receitas.push({nome:'Nova linha',unid:'unidades',qtd:1000,cresc:5,ramp:'100',preco:1000,esc:m.inflacao});save();render()},
   delRev:()=>{m.receitas.splice(+d.i,1);save();render()},
   addCap:()=>{m.capex.push({nome:'Novo investimento',ano:1,valor:0,vida:5});save();render()},
   delCap:()=>{m.capex.splice(+d.i,1);save();render()},
   copyFS:()=>copyTxt(fsCSV(),'Demonstrações copiadas (CSV)'),
   repCopy:()=>copyTxt([...document.querySelectorAll('.docv .page')].map(p=>p.innerText).join('\n\n'),'Texto do relatório copiado'),
   anDemo:()=>{S.an={empresa:DEMO_BAL.empresa,anos:DEMO_BAL.anos,N1:demoCSV(DEMO_BAL.N1),N:demoCSV(DEMO_BAL.N),pctCP:30,moeda:'Kz'};save();SUB.at='racios';render();toast('Balancetes de exemplo carregados')},
   anRun:()=>{S.an={empresa:$('#anEmp').value,anos:[$('#anY1').value,$('#anY2').value],N1:$('#anT1').value.trim(),N:$('#anT2').value.trim(),pctCP:Number($('#anCP').value)||0,moeda:$('#anMo').value};save();const A=analyze();if(!A||A.err)return render();SUB.at='balanco';render();toast('Análise concluída')},
   anToModel:()=>{const A=analyze();const {B,P}=A.cN;const sk=P.cev/P.vn>0.5?'comercio':'servicos';const nm=newModel(sk);nm.nome=`${S.an.empresa||'Empresa'} — avaliação`;nm.inicio='existente';nm.moeda=S.an.moeda;nm.anoBase=+S.an.anos[1]||2025;nm.inicioOp=1;
     nm.receitas=[{nome:'Volume de negócios',unid:'índice',qtd:1,cresc:5,ramp:'100',preco:P.vn,esc:nm.inflacao>5?12:2}];nm.cvar=+(P.cev/P.vn*100).toFixed(2);nm.pessoal=P.pes;nm.fst=P.oCus*0.85;nm.outros=P.oCus*0.15;nm.capex=[];nm.manut=+Math.max(1,(P.amort/P.vn*100)).toFixed(2);
     nm.dso=Math.round((B.clientes+B.oAct)/P.vn*365);nm.dio=Math.round(B.exist/P.cev*365);nm.dpo=Math.round((B.fornec+B.oPas+B.prov)/(P.cev+P.oCus*0.85)*365);nm.ii=P.rai>0?Math.round(P.imp/P.rai*100):25;
     const avgD=A.c1?(B.emprest+A.c1.B.emprest)/2:B.emprest;nm.abertura={imob:B.anc,vidaRem:8,exist:B.exist,clientes:B.clientes+B.oAct,caixa:B.caixa,fornec:B.fornec+B.oPas+B.prov,divida:B.emprest,divTaxa:avgD?+(P.cFin/avgD*100).toFixed(1):12,divPrazo:4};
     nm.divida.montante=0;nm.tv.metodo='gordon';nm.caixaMin=Math.round(B.caixa*0.3);nm.payout=40;S.models.push(nm);S.active=nm.id;save();go('painel');toast('Modelo de avaliação criado a partir das demonstrações');}
  };
  if(A[d.act]){ev.preventDefault();A[d.act]();}
});
$('#mSel').onchange=()=>{S.active=$('#mSel').value;save();render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const h0=(location.hash||'').slice(1);if(VIEWS[h0])VIEW=h0;
render();
</script>
