# Cópia de segurança diária da base de dados (Neon), cifrada, guardada 30 dias como artefacto privado do GitHub.
# Complementa o restauro do próprio Neon (histórico/ramificação). Restauro: ver docs/DEPLOY.md, secção "Cópias de segurança".
name: Cópia de segurança

on:
  schedule:
    - cron: '17 1 * * *' # 02:17 em Luanda
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    if: vars.KIANDA_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Só para decidir se a cópia do R2 corre (os condicionais dos passos não lêem secrets directamente).
      R2_ACCESS_KEY_ID: ${{ secrets.KIANDA_R2_ACCESS_KEY_ID }}
    steps:
      - name: Verificar secrets
        run: |
          [ -n "$DATABASE_URL" ] || { echo "::error title=Cópia de segurança::Falta o secret KIANDA_DATABASE_URL"; exit 1; }
          [ ${#PASSPHRASE} -ge 20 ] || { echo "::error title=Cópia de segurança::Defina o secret KIANDA_BACKUP_PASSPHRASE (20+ caracteres). Sem ele a cópia não é feita — nunca se guardam dados de clientes sem cifra."; exit 1; }
        env:
          DATABASE_URL: ${{ secrets.KIANDA_DATABASE_URL }}
          PASSPHRASE: ${{ secrets.KIANDA_BACKUP_PASSPHRASE }}

      - name: pg_dump cifrado (AES-256)
        run: |
          set -euo pipefail
          stamp=$(TZ=Africa/Luanda date +%Y-%m-%d_%H%M)
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          # pg_dump recente (consegue copiar versões anteriores do servidor); formato custom para pg_restore.
          docker run --rm -e DATABASE_URL postgres:18 sh -c 'pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL"' > /tmp/kianda.dump
          size=$(stat -c %s /tmp/kianda.dump)
          [ "$size" -gt 10000 ] || { echo "::error title=Cópia de segurança::Cópia demasiado pequena ($size bytes)"; exit 1; }
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" --symmetric --cipher-algo AES256 -o "/tmp/kianda-$stamp.dump.gpg" /tmp/kianda.dump
          shred -u /tmp/kianda.dump
          sha256sum "/tmp/kianda-$stamp.dump.gpg" | tee "/tmp/kianda-$stamp.sha256"
          echo "Cópia: $(numfmt --to=iec "$size") (antes da cifra)"
        env:
          DATABASE_URL: ${{ secrets.KIANDA_DATABASE_URL }}
          PASSPHRASE: ${{ secrets.KIANDA_BACKUP_PASSPHRASE }}

      # Prova, em cada cópia, que o ficheiro cifrado se decifra com a frase gravada e contém a base completa.
      # Se falhar, a execução fica vermelha: uma cópia que não se restaura não conta como cópia.
      - name: Teste de restauro (decifrar, reconstruir numa base isolada e consultar)
        run: |
          set -euo pipefail
          fail() { echo "::error title=Cópia de segurança::$1"; exit 1; }
          gpg --batch --quiet --pinentry-mode loopback --passphrase "$PASSPHRASE" -d "/tmp/kianda-$STAMP.dump.gpg" > /tmp/check.dump || fail "A cópia não se decifra com a frase gravada"
          docker run --rm -v /tmp:/w postgres:18 pg_restore --list /w/check.dump > /tmp/check.list || fail "A cópia decifrada não é legível pelo pg_restore"
          tables=$(grep -c " TABLE DATA public " /tmp/check.list || true)
          [ "$tables" -ge 20 ] || fail "A cópia tem apenas $tables tabelas com dados"
          for t in companies users subscriptions financial_models; do grep -q " TABLE DATA public $t " /tmp/check.list || fail "Falta a tabela $t na cópia"; done
          rm -f /tmp/check.list
          # Restauro real numa base Postgres isolada (contentor efémero, sem rede para fora do runner):
          # a cópia só conta se se reconstrói e responde às consultas essenciais.
          docker network create kianda-restore >/dev/null
          docker run -d --name kianda-restore --network kianda-restore -e POSTGRES_PASSWORD=restore -e POSTGRES_DB=kianda postgres:18 >/dev/null
          for i in $(seq 1 30); do docker exec kianda-restore pg_isready -U postgres -d kianda >/dev/null 2>&1 && break; sleep 2; done
          docker exec kianda-restore psql -U postgres -d kianda -qc "CREATE ROLE kianda_app NOLOGIN" >/dev/null
          docker run --rm --network kianda-restore -v /tmp:/w -e PGPASSWORD=restore postgres:18 \
            pg_restore --no-owner --no-privileges -h kianda-restore -U postgres -d kianda /w/check.dump > /tmp/restore.log 2>&1 || true
          # Só se toleram avisos benignos do ambiente gerido (esquema/extensão já existentes); qualquer outro erro falha.
          if grep "pg_restore: error:" /tmp/restore.log | grep -vE "already exists|must be owner of (extension|schema)" ; then fail "O pg_restore falhou ao reconstruir a base"; fi
          rm -f /tmp/restore.log
          shred -u /tmp/check.dump
          q() { docker exec kianda-restore psql -U postgres -d kianda -tAc "$1"; }
          companies=$(q "select count(*) from companies"); users=$(q "select count(*) from users"); migrations=$(q "select count(*) from drizzle.__drizzle_migrations" 2>/dev/null || echo 0)
          [ "$companies" -ge 1 ] || fail "Base restaurada sem empresas"
          [ "$users" -ge 1 ] || fail "Base restaurada sem utilizadores"
          [ "$migrations" -ge 50 ] || fail "Base restaurada sem o registo de migrações ($migrations)"
          q "select count(*) from pg_policies where policyname = 'empresa'" | grep -qv '^0$' || fail "Base restaurada sem as políticas RLS por empresa"
          # A cópia usa --no-privileges. Recria os acessos de leitura do papel restrito e confirma que o isolamento funciona.
          docker exec -i kianda-restore psql -U postgres -d kianda -v ON_ERROR_STOP=1 -q >/dev/null <<'SQL'
          GRANT USAGE ON SCHEMA public TO kianda_app;
          GRANT SELECT ON users TO kianda_app;
          BEGIN;
          SELECT set_config('app.company_id', (SELECT company_id FROM users LIMIT 1), true);
          SET LOCAL ROLE kianda_app;
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM users WHERE company_id = kianda_tenant())
               OR EXISTS (SELECT 1 FROM users WHERE company_id <> kianda_tenant()) THEN
              RAISE EXCEPTION 'Isolamento da empresa falhou na base restaurada';
            END IF;
          END $$;
          ROLLBACK;
          SQL
          docker rm -f kianda-restore >/dev/null; docker network rm kianda-restore >/dev/null
          echo "Restauro verificado: $tables tabelas com dados; base reconstruída com $companies empresa(s), $users utilizador(es) e $migrations migrações."
          # Identifica a frase usada sem a revelar: compare com a da sua cópia guardada (docs/DEPLOY.md).
          echo "Impressão digital da frase (SHA-256, 8 caracteres): $(printf %s "$PASSPHRASE" | sha256sum | cut -c1-8)"
        env:
          PASSPHRASE: ${{ secrets.KIANDA_BACKUP_PASSPHRASE }}

      # Ficheiros anexados no R2 (opcional): só corre se os secrets da chave S3 do R2 existirem.
      # Sem eles, o R2 fica coberto apenas pela durabilidade do próprio Cloudflare (ver docs/DEPLOY.md).
      - name: Cópia cifrada e restauro de ensaio dos ficheiros do R2
        if: env.R2_ACCESS_KEY_ID != ''
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=auto
          backup_dir=$(mktemp -d)
          trap 'rm -rf -- "$backup_dir"' EXIT
          mkdir "$backup_dir/r2" "$backup_dir/restored"
          aws s3 sync "s3://${R2_BUCKET:-kianda-files}" "$backup_dir/r2" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --only-show-errors
          count=$(find "$backup_dir/r2" -type f | wc -l)
          archive="/tmp/kianda-r2-$STAMP.tgz.gpg"
          tar -C "$backup_dir" -czf - r2 | gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" --symmetric --cipher-algo AES256 -o "$archive"
          gpg --batch --quiet --pinentry-mode loopback --passphrase "$PASSPHRASE" -d "$archive" | tar -xzf - -C "$backup_dir/restored"
          diff -qr "$backup_dir/r2" "$backup_dir/restored/r2" >/dev/null || { echo "::error title=Restauro R2::Os ficheiros restaurados divergem da cópia de origem"; exit 1; }
          sha256sum "$archive" >> "/tmp/kianda-$STAMP.sha256"
          echo "R2: $count ficheiro(s) copiados, cifrados e restaurados em ambiente isolado."
        env:
          R2_SECRET_ACCESS_KEY: ${{ secrets.KIANDA_R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.KIANDA_R2_BUCKET }}
          PASSPHRASE: ${{ secrets.KIANDA_BACKUP_PASSPHRASE }}

      - uses: actions/upload-artifact@v4
        with:
          name: kianda-db-${{ env.STAMP }}
          path: |
            /tmp/kianda-${{ env.STAMP }}.dump.gpg
            /tmp/kianda-r2-${{ env.STAMP }}.tgz.gpg
            /tmp/kianda-${{ env.STAMP }}.sha256
          retention-days: 30
          if-no-files-found: error
