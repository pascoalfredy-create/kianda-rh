# Cópia de segurança diária da base de dados (Neon), cifrada, guardada 30 dias como artefacto do GitHub.
# Complementa o restauro do próprio Neon (histórico/ramificação). Restauro: ver docs/DEPLOY.md, secção "Cópias de segurança".
name: Cópia de segurança

on:
  schedule:
    - cron: '17 1 * * *' # 02:17 em Luanda
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/backup.yml']

permissions:
  contents: read

jobs:
  backup:
    if: vars.KIANDA_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Só para decidir se a cópia do R2 corre (os condicionais dos passos não lêem secrets directamente).
      R2_ACCESS_KEY_ID: ${{ secrets.KIANDA_R2_ACCESS_KEY_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Preparar a aplicação para o ensaio
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @kianda/core build
          pnpm --filter @kianda/db build
          pnpm --filter @kianda/web build
          pnpm --filter @kianda/e2e exec playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils

      - name: Verificar secrets
        run: |
          [ -n "$DATABASE_URL" ] || { echo "::error title=Cópia de segurança::Falta o secret KIANDA_DATABASE_URL"; exit 1; }
          [ ${#PASSPHRASE} -ge 20 ] || { echo "::error title=Cópia de segurança::Defina o secret KIANDA_BACKUP_PASSPHRASE (20+ caracteres). Sem ele a cópia não é feita — nunca se guardam dados de clientes sem cifra."; exit 1; }
        env:
          DATABASE_URL: ${{ secrets.KIANDA_DATABASE_URL }}
          PASSPHRASE: ${{ secrets.KIANDA_BACKUP_PASSPHRASE }}

      - name: pg_dump cifrado (AES-256)
        run: |
          set -euo pipefail
          stamp=$(TZ=Africa/Luanda date +%Y-%m-%d_%H%M)
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          # pg_dump recente (consegue copiar versões anteriores do servidor); formato custom para pg_restore.
          docker run --rm -e DATABASE_URL postgres:18 sh -c 'pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL"' > /tmp/kianda.dump
          size=$(stat -c %s /tmp/kianda.dump)
          [ "$size" -gt 10000 ] || { echo "::error title=Cópia de segurança::Cópia demasiado pequena ($size bytes)"; exit 1; }
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" --symmetric --cipher-algo AES256 -o "/tmp/kianda-$stamp.dump.gpg" /tmp/kianda.dump
          shred -u /tmp/kianda.dump
          sha256sum "/tmp/kianda-$stamp.dump.gpg" | tee "/tmp/kianda-$stamp.sha256"
          echo "Cópia: $(numfmt --to=iec "$size") (antes da cifra)"
        env:
          DATABASE_URL: ${{ secrets.KIANDA_DATABASE_URL }}
          PASSPHRASE: ${{ secrets.KIANDA_BACKUP_PASSPHRASE }}

      # Prova, em cada cópia, que o ficheiro cifrado se decifra com a frase gravada e contém a base completa.
      # Se falhar, a execução fica vermelha: uma cópia que não se restaura não conta como cópia.
      - name: Teste de restauro (decifrar, reconstruir numa base isolada e consultar)
        run: |
          set -euo pipefail
          fail() { echo "::error title=Cópia de segurança::$1"; exit 1; }
          gpg --batch --quiet --pinentry-mode loopback --passphrase "$PASSPHRASE" -d "/tmp/kianda-$STAMP.dump.gpg" > /tmp/check.dump || fail "A cópia não se decifra com a frase gravada"
          docker run --rm -v /tmp:/w postgres:18 pg_restore --list /w/check.dump > /tmp/check.list || fail "A cópia decifrada não é legível pelo pg_restore"
          tables=$(grep -c " TABLE DATA public " /tmp/check.list || true)
          [ "$tables" -ge 20 ] || fail "A cópia tem apenas $tables tabelas com dados"
          for t in companies users subscriptions financial_models; do grep -q " TABLE DATA public $t " /tmp/check.list || fail "Falta a tabela $t na cópia"; done
          rm -f /tmp/check.list
          # Restauro real numa base Postgres isolada (contentor efémero, sem rede para fora do runner):
          # a cópia só conta se se reconstrói e responde às consultas essenciais.
          docker network create --internal kianda-restore >/dev/null
          docker run -d --name kianda-restore --network kianda-restore -p 127.0.0.1:15432:5432 -e POSTGRES_PASSWORD=restore -e POSTGRES_DB=kianda postgres:18 >/dev/null
          for i in $(seq 1 30); do docker exec kianda-restore pg_isready -U postgres -d kianda >/dev/null 2>&1 && break; sleep 2; done
          docker exec kianda-restore psql -U postgres -d kianda -qc "CREATE ROLE kianda_app NOLOGIN" >/dev/null
          if ! docker run --rm --network kianda-restore -v /tmp:/w -e PGPASSWORD=restore postgres:18 \
            pg_restore --no-owner --no-privileges -h kianda-restore -U postgres -d kianda /w/check.dump > /tmp/restore.log 2>&1; then
            # Os detalhes do restauro podem incluir dados de clientes. Registar apenas o estado no GitHub.
            errors=$(grep -c '^pg_restore: error:' /tmp/restore.log || true)
            benign=$(grep -cE '^pg_restore: error: .*(already exists|must be owner of (extension|schema))' /tmp/restore.log || true)
            [ "$errors" -gt 0 ] && [ "$errors" = "$benign" ] || fail "O pg_restore falhou ao reconstruir a base"
          fi
          rm -f /tmp/restore.log
          shred -u /tmp/check.dump
          q() { docker exec kianda-restore psql -X -U postgres -d kianda -v ON_ERROR_STOP=1 -tAc "$1"; }
          companies=$(q "select count(*) from companies"); users=$(q "select count(*) from users"); migrations=$(q "select count(*) from drizzle.__drizzle_migrations" 2>/dev/null || echo 0)
          [ "$companies" -ge 1 ] || fail "Base restaurada sem empresas"
          [ "$users" -ge 1 ] || fail "Base restaurada sem utilizadores"
          [ "$migrations" -ge 50 ] || fail "Base restaurada sem o registo de migrações ($migrations)"
          q "select count(*) from pg_policies where policyname = 'empresa'" | grep -qv '^0$' || fail "Base restaurada sem as políticas RLS por empresa"
          # Os GRANT não vêm no dump. O ensaio concede leitura só às tabelas que verifica.
          docker exec -i kianda-restore psql -X -U postgres -d kianda -v ON_ERROR_STOP=1 -q >/dev/null <<'SQL'
          BEGIN;
          GRANT USAGE ON SCHEMA public TO kianda_app;
          GRANT SELECT ON companies, users, employees, payroll_runs, payroll_lines, financial_models,
            financial_model_versions, valuation_analyses, valuation_versions, files, file_blobs TO kianda_app;
          DO $$
          DECLARE
            t record;
            tenant text;
            expected bigint;
            actual bigint;
          BEGIN
            FOR t IN SELECT * FROM (VALUES
              ('companies', 'id'), ('users', 'company_id'), ('employees', 'company_id'),
              ('payroll_runs', 'company_id'), ('payroll_lines', '(SELECT company_id FROM public.payroll_runs WHERE id = item.run_id)'),
              ('financial_models', 'company_id'), ('financial_model_versions', 'company_id'),
              ('valuation_analyses', 'company_id'), ('valuation_versions', 'company_id'),
              ('files', 'company_id'), ('file_blobs', 'company_id')
            ) AS tables(name, tenant_expression) LOOP
              IF NOT EXISTS (SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE n.nspname = 'public' AND c.relname = t.name AND c.relrowsecurity) THEN
                RAISE EXCEPTION 'RLS ausente: %', t.name;
              END IF;
              PERFORM set_config('app.company_id', '', true);
              SET LOCAL ROLE kianda_app;
              EXECUTE format('SELECT count(*) FROM public.%I', t.name) INTO actual;
              RESET ROLE;
              IF actual <> 0 THEN RAISE EXCEPTION 'Leitura sem empresa: %', t.name; END IF;
              FOR tenant IN SELECT id FROM public.companies ORDER BY id LIMIT 2 LOOP
                EXECUTE format('SELECT count(*) FROM public.%I AS item WHERE %s = $1', t.name, t.tenant_expression)
                  INTO expected USING tenant;
                PERFORM set_config('app.company_id', tenant, true);
                SET LOCAL ROLE kianda_app;
                EXECUTE format('SELECT count(*) FROM public.%I', t.name) INTO actual;
                RESET ROLE;
                IF actual <> expected THEN RAISE EXCEPTION 'Isolamento da empresa falhou: %', t.name; END IF;
              END LOOP;
            END LOOP;
          END $$;
          ROLLBACK;
          SQL
          # Reconstituir a ligação usada pela aplicação entre os metadados e os dois meios de armazenamento.
          invalid=$(q "SELECT count(*) FROM files f LEFT JOIN file_blobs b ON b.file_id = f.id AND b.company_id = f.company_id
            WHERE (f.storage = 'db' AND (octet_length(b.data) IS DISTINCT FROM f.size_bytes OR encode(sha256(b.data), 'hex') IS DISTINCT FROM f.sha256))
               OR (f.storage = 'r2' AND (f.company_id !~ '^[A-Za-z0-9_-]+$' OR f.id !~ '^[A-Za-z0-9_-]+$' OR f.sha256 !~ '^[a-f0-9]{64}$'))
               OR f.storage NOT IN ('db', 'r2')")
          [ "$invalid" = 0 ] || fail "$invalid anexo(s) com conteúdo na base ou metadados inválidos"
          umask 077
          q "SELECT sha256 || '  ' || company_id || '/' || id FROM files WHERE storage = 'r2'" > /tmp/kianda-r2.sha256
          [ ! -s /tmp/kianda-r2.sha256 ] || [ -n "$R2_ACCESS_KEY_ID" ] || fail "A base contém anexos no R2 e falta a chave para copiar o bucket"
          echo "Restauro verificado: $tables tabelas com dados; base reconstruída com $companies empresa(s), $users utilizador(es) e $migrations migrações."
        env:
          PASSPHRASE: ${{ secrets.KIANDA_BACKUP_PASSPHRASE }}

      # A cópia de objectos é necessária quando a base restaurada referencia ficheiros no R2.
      - name: Cópia cifrada e restauro de ensaio dos ficheiros do R2
        if: env.R2_ACCESS_KEY_ID != ''
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=auto
          backup_dir=$(mktemp -d)
          trap 'rm -rf -- "$backup_dir"; rm -f /tmp/kianda-r2.sha256' EXIT
          mkdir "$backup_dir/r2" "$backup_dir/restored"
          aws s3 sync "s3://${R2_BUCKET:-kianda-files}" "$backup_dir/r2" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --only-show-errors
          count=$(find "$backup_dir/r2" -type f | wc -l)
          archive="/tmp/kianda-r2-$STAMP.tgz.gpg"
          tar -C "$backup_dir" -czf - r2 | gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" --symmetric --cipher-algo AES256 -o "$archive"
          gpg --batch --quiet --pinentry-mode loopback --passphrase "$PASSPHRASE" -d "$archive" | tar -xzf - -C "$backup_dir/restored"
          diff -qr "$backup_dir/r2" "$backup_dir/restored/r2" >/dev/null || { echo "::error title=Restauro R2::Os ficheiros restaurados divergem da cópia de origem"; exit 1; }
          if [ -s /tmp/kianda-r2.sha256 ]; then
            (cd "$backup_dir/restored/r2" && sha256sum --check --strict --quiet /tmp/kianda-r2.sha256) >/dev/null 2>&1 \
              || { echo "::error title=Restauro R2::Há anexos em falta ou com conteúdo diferente do registado na base restaurada"; exit 1; }
          fi
          mv "$backup_dir/restored/r2" "$RUNNER_TEMP/kianda-recovery-objects"
          sha256sum "$archive" >> "/tmp/kianda-$STAMP.sha256"
          echo "R2: $count ficheiro(s) copiados, cifrados e restaurados em ambiente isolado."
          echo "Anexos R2 conferidos com a base restaurada: $(wc -l < /tmp/kianda-r2.sha256)."
        env:
          R2_SECRET_ACCESS_KEY: ${{ secrets.KIANDA_R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.KIANDA_R2_BUCKET }}
          PASSPHRASE: ${{ secrets.KIANDA_BACKUP_PASSPHRASE }}

      - name: Testar a aplicação com a base e os anexos restaurados
        env:
          DATABASE_URL: postgresql://postgres:restore@127.0.0.1:15432/kianda
          RECOVERY_OBJECTS: ${{ runner.temp }}/kianda-recovery-objects
        run: |
          set -euo pipefail
          umask 077
          started=$SECONDS
          mkdir -p "$RECOVERY_OBJECTS"
          # A API de ensaio usa um segredo efémero e o ambiente fica sem credenciais de produção.
          API_JWT_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$API_JWT_SECRET"
          export API_JWT_SECRET
          unset RESEND_API_KEY PROXYPAY_API_KEY VENDUS_API_KEY APP_BASE_URL KIANDA_HOSTNAME
          # Reaplicar as permissões das migrações omitidas pelo dump.
          awk '/^(GRANT |REVOKE |ALTER DEFAULT PRIVILEGES )/ { sub(/--> statement-breakpoint.*$/, ""); print }' packages/db/migrations/*.sql |
            docker exec -i kianda-restore psql -X -U postgres -d kianda -v ON_ERROR_STOP=1 -q > "$RUNNER_TEMP/kianda-recovery-grants.log" 2>&1
          # Só os dados de ensaio passam pelos ecrãs e pelos relatórios do navegador.
          if ! pnpm --filter @kianda/e2e e2e --project=computador recovery.spec.ts integra.spec.ts valora.spec.ts > "$RUNNER_TEMP/kianda-recovery-e2e.log" 2>&1; then
            echo "::error title=Recuperação::Falhou a validação da aplicação com a cópia restaurada."
            exit 1
          fi
          echo "Aplicação na base restaurada: login, anexos, isolamento e PDFs verificados em $((SECONDS - started)) segundos."

      - name: Remover a instância e conteúdos temporários
        if: always()
        run: |
          docker rm -f kianda-restore >/dev/null 2>&1 || true
          docker network rm kianda-restore >/dev/null 2>&1 || true
          rm -rf -- "$RUNNER_TEMP/kianda-recovery-objects" apps/e2e/test-results apps/e2e/playwright-report
          rm -f "$RUNNER_TEMP"/kianda-recovery-{grants,e2e}.log /tmp/check.dump /tmp/kianda.dump /tmp/kianda-r2.sha256

      - uses: actions/upload-artifact@v4
        # Uma alteração ao workflow ensaia o restauro em main. A retenção continua diária e manual.
        if: github.event_name != 'push'
        with:
          name: kianda-db-${{ env.STAMP }}
          path: |
            /tmp/kianda-${{ env.STAMP }}.dump.gpg
            /tmp/kianda-r2-${{ env.STAMP }}.tgz.gpg
            /tmp/kianda-${{ env.STAMP }}.sha256
          retention-days: 30
          if-no-files-found: error
