name: CI e publicação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: kianda-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Verificar e testar
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kianda
          POSTGRES_PASSWORD: kianda
          POSTGRES_DB: kianda
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kianda" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kianda:kianda@localhost:5432/kianda
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kianda/core build
      - run: pnpm --filter @kianda/db build
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build Cloudflare (OpenNext)
        run: pnpm --filter @kianda/web cf:build

  deploy:
    name: Publicar no Cloudflare
    needs: test
    # Só em main e depois de configurado (variável de repositório KIANDA_DEPLOY = true). Ver docs/DEPLOY.md.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.KIANDA_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Validar secrets (uma linha, sem espaços)
        run: |
          bad=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID KIANDA_HYPERDRIVE_ID KIANDA_DATABASE_URL KIANDA_JWT_SECRET; do
            v="${!name}"
            if [ -z "$v" ]; then echo "::error title=Secret em falta::$name não está definido"; bad=1;
            elif printf '%s' "$v" | grep -q '[[:space:]]'; then echo "::error title=Secret inválido::$name tem espaços ou várias linhas — volte a colá-lo só com o valor, numa linha"; bad=1; fi
          done
          [ ${#KIANDA_JWT_SECRET} -ge 32 ] || { echo "::error title=Secret inválido::KIANDA_JWT_SECRET precisa de pelo menos 32 caracteres"; bad=1; }
          exit $bad
        env:
          KIANDA_HYPERDRIVE_ID: ${{ secrets.KIANDA_HYPERDRIVE_ID }}
          KIANDA_DATABASE_URL: ${{ secrets.KIANDA_DATABASE_URL }}
          KIANDA_JWT_SECRET: ${{ secrets.KIANDA_JWT_SECRET }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kianda/core build
      - run: pnpm --filter @kianda/db build

      - name: Migrações na base de dados de produção (Neon)
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.KIANDA_DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.KIANDA_DATABASE_CA_CERT }}

      - name: Dados de demonstração (opcional, idempotente)
        if: vars.KIANDA_SEED_DEMO == 'true'
        run: pnpm db:seed
        env:
          DATABASE_URL: ${{ secrets.KIANDA_DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.KIANDA_DATABASE_CA_CERT }}
          SEED_OWNER_PASSWORD: ${{ secrets.KIANDA_SEED_OWNER_PASSWORD }}

      - name: Preparar configuração de produção
        run: node scripts/cf-prepare.mjs
        env:
          KIANDA_HYPERDRIVE_ID: ${{ secrets.KIANDA_HYPERDRIVE_ID }}
          KIANDA_HOSTNAME: ${{ vars.KIANDA_HOSTNAME }}

      - name: Publicar API (kianda-api, sem endereço público)
        working-directory: apps/api
        run: |
          ../../scripts/ci-run.sh "wrangler deploy (API)" npx wrangler deploy --config wrangler.deploy.json
          printf '{"API_JWT_SECRET":"%s"}' "$API_JWT_SECRET" > /tmp/secrets.json
          ../../scripts/ci-run.sh "wrangler secret bulk (API)" npx wrangler secret bulk /tmp/secrets.json --config wrangler.deploy.json
          rm -f /tmp/secrets.json
        env:
          API_JWT_SECRET: ${{ secrets.KIANDA_JWT_SECRET }}

      - name: Publicar web (kianda-web)
        working-directory: apps/web
        run: |
          ../../scripts/ci-run.sh "OpenNext build (web)" pnpm cf:build
          ../../scripts/ci-run.sh "wrangler deploy (web)" npx wrangler deploy --config wrangler.deploy.json

      - name: Verificar
        if: vars.KIANDA_HOSTNAME != ''
        run: |
          sleep 15
          scripts/ci-run.sh "Verificar /api/health" curl -sS --fail-with-body "https://${{ vars.KIANDA_HOSTNAME }}/api/health"
