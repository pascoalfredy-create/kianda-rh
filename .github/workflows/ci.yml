name: CI e publicação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: kianda-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Verificar e testar
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kianda
          POSTGRES_PASSWORD: kianda
          POSTGRES_DB: kianda
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kianda" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://kianda:kianda@localhost:5432/kianda
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kianda/core build
      - run: pnpm --filter @kianda/db build
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build Cloudflare (OpenNext)
        run: pnpm --filter @kianda/web cf:build

  deploy:
    name: Publicar no Cloudflare
    needs: test
    # Só em main e depois de configurado (variável de repositório KIANDA_DEPLOY = true). Ver docs/DEPLOY.md.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.KIANDA_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Validar secrets (uma linha, sem espaços)
        run: |
          bad=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID KIANDA_HYPERDRIVE_ID KIANDA_DATABASE_URL KIANDA_JWT_SECRET; do
            v="${!name}"
            if [ -z "$v" ]; then echo "::error title=Secret em falta::$name não está definido"; bad=1;
            elif printf '%s' "$v" | grep -q '[[:space:]]'; then echo "::error title=Secret inválido::$name tem espaços ou várias linhas — volte a colá-lo só com o valor, numa linha"; bad=1; fi
          done
          [ ${#KIANDA_JWT_SECRET} -ge 32 ] || { echo "::error title=Secret inválido::KIANDA_JWT_SECRET precisa de pelo menos 32 caracteres"; bad=1; }
          exit $bad
        env:
          KIANDA_HYPERDRIVE_ID: ${{ secrets.KIANDA_HYPERDRIVE_ID }}
          KIANDA_DATABASE_URL: ${{ secrets.KIANDA_DATABASE_URL }}
          KIANDA_JWT_SECRET: ${{ secrets.KIANDA_JWT_SECRET }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kianda/core build
      - run: pnpm --filter @kianda/db build

      - name: Migrações na base de dados de produção (Neon)
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.KIANDA_DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.KIANDA_DATABASE_CA_CERT }}

      - name: Administradores da plataforma
        run: pnpm --filter @kianda/db platform-admins
        env:
          DATABASE_URL: ${{ secrets.KIANDA_DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.KIANDA_DATABASE_CA_CERT }}
          KIANDA_PLATFORM_ADMINS: ${{ vars.KIANDA_PLATFORM_ADMINS }}
          SEED_OWNER_PASSWORD: ${{ secrets.KIANDA_SEED_OWNER_PASSWORD }}

      - name: Dados de demonstração (opcional, idempotente)
        if: vars.KIANDA_SEED_DEMO == 'true'
        run: pnpm db:seed
        env:
          DATABASE_URL: ${{ secrets.KIANDA_DATABASE_URL }}
          DATABASE_CA_CERT: ${{ secrets.KIANDA_DATABASE_CA_CERT }}
          SEED_OWNER_PASSWORD: ${{ secrets.KIANDA_SEED_OWNER_PASSWORD }}

      - name: Domínio principal (o primeiro de KIANDA_HOSTNAME)
        run: |
          h="${KIANDA_HOSTNAME%%,*}"; h="${h// /}"
          echo "PRIMARY_HOST=$h" >> "$GITHUB_ENV"
        env:
          KIANDA_HOSTNAME: ${{ vars.KIANDA_HOSTNAME }}

      - name: Armazenamento de ficheiros (R2, opcional)
        working-directory: apps/api
        run: |
          # Sem R2 activo na conta (ou sem permissão no token), os ficheiros ficam na base de dados — a publicação continua.
          if npx wrangler r2 bucket list 2>/dev/null | grep -q 'kianda-files'; then ok=1
          elif out=$(npx wrangler r2 bucket create kianda-files 2>&1); then ok=1
          else ok=0; echo "::warning title=R2 indisponível::os ficheiros anexados ficam na base de dados (limite de 250 MB por empresa). Active o R2 na conta Cloudflare e dê ao token a permissão 'Workers R2 Storage: Edit'. $(echo "$out" | tail -2 | tr '\n' ' ')"; fi
          [ "$ok" = 1 ] && echo "KIANDA_R2=1" >> "$GITHUB_ENV" && echo "R2: bucket kianda-files ligado"
          true

      - name: Preparar configuração de produção
        run: node scripts/cf-prepare.mjs
        env:
          KIANDA_HYPERDRIVE_ID: ${{ secrets.KIANDA_HYPERDRIVE_ID }}
          KIANDA_HOSTNAME: ${{ vars.KIANDA_HOSTNAME }}

      - name: Publicar API (kianda-api, sem endereço público)
        working-directory: apps/api
        run: |
          ../../scripts/ci-run.sh "wrangler deploy (API)" npx wrangler deploy --config wrangler.deploy.json
          # Só seguem as integrações configuradas (secret/variável vazia = integração desligada).
          node -e 'const k=["API_JWT_SECRET","PROXYPAY_API_KEY","PROXYPAY_ENV","PROXYPAY_ENTITY","RESEND_API_KEY","MAIL_FROM","VENDUS_API_KEY","VENDUS_MODE","APP_BASE_URL","KIANDA_MODELING_OWNER_USER_ID"];const o={};for(const n of k){const v=(process.env[n]||"").trim();if(v)o[n]=v}require("fs").writeFileSync("/tmp/secrets.json",JSON.stringify(o));console.log("Configuração do Worker:",Object.keys(o).join(", "))'
          ../../scripts/ci-run.sh "wrangler secret bulk (API)" npx wrangler secret bulk /tmp/secrets.json --config wrangler.deploy.json
          rm -f /tmp/secrets.json
        env:
          KIANDA_MODELING_OWNER_USER_ID: ${{ vars.KIANDA_MODELING_OWNER_USER_ID }}
          API_JWT_SECRET: ${{ secrets.KIANDA_JWT_SECRET }}
          PROXYPAY_API_KEY: ${{ secrets.KIANDA_PROXYPAY_API_KEY }}
          PROXYPAY_ENV: ${{ vars.KIANDA_PROXYPAY_ENV }}
          PROXYPAY_ENTITY: ${{ vars.KIANDA_PROXYPAY_ENTITY }}
          RESEND_API_KEY: ${{ secrets.KIANDA_RESEND_API_KEY }}
          MAIL_FROM: ${{ vars.KIANDA_MAIL_FROM }}
          VENDUS_API_KEY: ${{ secrets.KIANDA_VENDUS_API_KEY }}
          VENDUS_MODE: ${{ vars.KIANDA_VENDUS_MODE }}
          APP_BASE_URL: ${{ env.PRIMARY_HOST && format('https://{0}', env.PRIMARY_HOST) || '' }}

      - name: Publicar web (kianda-web)
        working-directory: apps/web
        run: |
          ../../scripts/ci-run.sh "OpenNext build (web)" pnpm cf:build
          ../../scripts/ci-run.sh "wrangler deploy (web)" npx wrangler deploy --config wrangler.deploy.json

      - name: Verificar
        if: vars.KIANDA_HOSTNAME != ''
        run: |
          sleep 15
          for h in $(echo "${{ vars.KIANDA_HOSTNAME }}" | tr ',' ' '); do
            scripts/ci-run.sh "Verificar /api/health em $h" curl -sS --fail-with-body "https://$h/api/health"
          done

      - name: Verificar base de dados (login de demonstração)
        if: vars.KIANDA_HOSTNAME != '' && vars.KIANDA_SEED_DEMO == 'true'
        run: |
          for email in admin@kwanzalog.co.ao edson@kwanzalog.co.ao joana@kwanzalog.co.ao; do
            printf '{"email":"%s","password":"%s"}' "$email" "$PW" > /tmp/login.json
            scripts/ci-run.sh "Login de demonstração $email" curl -sS --fail-with-body -o /tmp/login.out -X POST -H 'content-type: application/json' --data @/tmp/login.json "https://$PRIMARY_HOST/api/v1/auth/login"
            grep -q '"company"' /tmp/login.out && echo "Login OK: $email"
          done
          # Pedido autenticado (passa pelo RLS por empresa, via Hyperdrive): a proprietária vê os colaboradores da empresa demo.
          printf '{"email":"admin@kwanzalog.co.ao","password":"%s"}' "$PW" > /tmp/login.json
          curl -sS --fail-with-body -c /tmp/jar -o /dev/null -X POST -H 'content-type: application/json' --data @/tmp/login.json "https://$PRIMARY_HOST/api/v1/auth/login"
          scripts/ci-run.sh "Pedido com RLS (/v1/employees)" curl -sS --fail-with-body -b /tmp/jar -o /tmp/emp.out "https://$PRIMARY_HOST/api/v1/employees"
          n=$(grep -o '"number"' /tmp/emp.out | wc -l); [ "$n" -gt 0 ] || { echo "::error title=RLS::A lista de colaboradores veio vazia"; exit 1; }
          echo "RLS OK: $n colaborador(es) visíveis"
          rm -f /tmp/login.json /tmp/jar /tmp/emp.out
          rm -f /tmp/login.json /tmp/login.out
        env:
          PW: ${{ secrets.KIANDA_SEED_OWNER_PASSWORD }}
